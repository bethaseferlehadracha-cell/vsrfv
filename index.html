/* סריקת כלל הממצאים שהוזנו — חטיבה + מסגרות × ממדים */
function scanFindings(){
  const out=[];
  DATA.gph.forEach((t,ti)=>{ if(!t.scored||isTopicNA('gph','gph',ti))return;
    const sc=topicScore(t,(ci)=>gphCell(ti,ci));
    const finds=topicCrits('gph',ti,gphCell).filter(c=>c.score!=null&&c.score<70).map(c=>c.optText);
    if(sc==null&&!finds.length)return;
    out.push({dim:'gph',name:t.name,scope:'ניהול הדרכה חטיבתי גפ"ה',score:sc,find:finds.join('; ')});
  });
  S.frameworks.forEach(f=>{
    FW_DIMS.forEach(dim=>{
      DATA[dim].forEach((t,ti)=>{ if(!t.scored||isTopicNA(f.id,dim,ti))return;
        const sc=topicScore(t,(ci)=>fwCell(f.id,dim,ti,ci));
        const finds=topicCrits(dim,ti,(a,b)=>fwCell(f.id,dim,a,b)).filter(c=>c.score!=null&&c.score<70).map(c=>c.optText);
        if(sc==null&&!finds.length)return;
        out.push({dim,name:t.name,scope:(f.label||'מסגרת')+' · '+DIM_META[dim].short,score:sc,find:finds.join('; ')});
      });
    });
  });
  return out;
}

/* ====== איסוף סיווג שיפור/שימור לדוח ======
   scanKS(): כל נושא שדורג — שמו, ציונו הסופי, סיווגו, ופירוט תתי-הנושאים
   (הקריטריונים) שבו, כל אחד עם התשובה שנבחרה מבנק התשובות והציון שלה. */
/* פירוט הקריטריונים בנושא — שם הקריטריון, התשובה שנבחרה וציונה */
function topicCrits(dim,ti,getter){
  const t=(dim==='gph'?DATA.gph:DATA[dim])[ti];
  const out=[];
  t.crits.forEach((c,ci)=>{
    if(c.w==null)return;                       // סעיף שאינו משוקלל בציון
    const cell=getter(ti,ci); if(!cell||cell.opt==null)return;
    const o=critOpt(c,cell.opt); if(!o)return;
    out.push({ci,t:c.t,optK:o.k,optText:o.t,score:o.s});
  });
  return out;
}
function scanKS(){
  const out=[];
  // ניהול הדרכה חטיבתי גפ"ה
  DATA.gph.forEach((t,ti)=>{ if(!t.scored||isTopicNA('gph','gph',ti))return;
    const sc=topicScore(t,(ci)=>gphCell(ti,ci)); if(sc==null)return;
    const cls=ksAuto(sc); if(!cls)return;
    out.push({scope:'gph',dim:'gph',ti,name:t.name,area:'ניהול הדרכה חטיבתי גפ"ה',score:sc,cls,
      crits:topicCrits('gph',ti,gphCell)});
  });
  // רמת המסגרות × ממדים
  S.frameworks.forEach(f=>{
    FW_DIMS.forEach(dim=>{
      DATA[dim].forEach((t,ti)=>{ if(!t.scored||isTopicNA(f.id,dim,ti))return;
        const sc=topicScore(t,(ci)=>fwCell(f.id,dim,ti,ci)); if(sc==null)return;
        const cls=ksAuto(sc); if(!cls)return;
        out.push({scope:f.id,dim,ti,name:t.name,area:(f.label||'מסגרת')+' · '+DIM_META[dim].short,
          score:sc,cls,crits:topicCrits(dim,ti,(a,b)=>fwCell(f.id,dim,a,b))});
      });
    });
  });
  return out;
}

/* ====== ריכוז שיפור/שימור אוטומטי לדו"ח ======
   מקור יחיד לאמת: הציון הסופי של כל נושא (topicScore).
     ציון <  KS_THRESHOLD  =>  שיפור
     ציון >= KS_THRESHOLD  =>  שימור
   נושא נכלל אך ורק אם יש לו ציון מחושב — נושא איכותי (scored=false),
   נושא שסומן "לא רלוונטי", או נושא שטרם דורג, אינם מופיעים באף רשימה. */
function ksBuckets(){
  const all=scanKS();
  const bySide=cls=>all.filter(x=>x.cls===cls).sort((a,b)=>a.score-b.score||a.name.localeCompare(b.name,'he'));
  return {improve:bySide('improve'), keep:bySide('keep')};
}
function ksEntryHTML(x){
  const b=band(x.score);
  const crits=x.crits||[];
  return `<div class="ks-entry">
    <div class="kh"><b>${esc(x.name)}</b><span class="area">${esc(x.area)}</span>
      <span class="sc ${b.k?'bg-'+b.k:''}">${Math.round(x.score)}</span></div>
    ${crits.length?`<div class="ks-crits">${crits.map(c=>{
      const cb=c.score==null?'':band(c.score).k;
      return `<div class="ks-crit">
        <span class="cscore ${cb?'bg-'+cb:''}">${c.score==null?'—':c.score}</span>
        <span class="ctxt"><b>${esc(c.t)}</b><span class="cans">${esc(c.optText)}</span></span>
      </div>`;}).join('')}</div>`:''}
  </div>`;
}
function ksColHTML(cls,items){
  const title = cls==='keep' ? 'שימור' : 'שיפור';
  const rule  = cls==='keep' ? `ציון ${KS_THRESHOLD} ומעלה` : `ציון נמוך מ-${KS_THRESHOLD}`;
  const ic    = cls==='keep' ? '<path d="M20 6L9 17l-5-5"/>' : '<path d="M12 20V10M6 20V4M18 20v-7"/>';
  return `<div class="ks-col ${cls}">
    <h4>${svg(ic)}${title}<span class="cnt">${items.length}</span></h4>
    ${items.length ? items.map(ksEntryHTML).join('')
                   : `<p class="ks-empty">אין נושאים ב${rule}.</p>`}
  </div>`;
}
/* הבלוק המלא — משמש גם במחולל הדוחות וגם בדו"ח המופק */
function ksReportHTML(){
  const bk=ksBuckets();
  if(!bk.improve.length && !bk.keep.length)
    return '<p class="ks-empty">טרם נבחרו אפשרויות — ריכוז השיפור/שימור ייבנה אוטומטית עם בחירת האפשרויות.</p>';
  return `<div class="ks-report">${ksColHTML('improve',bk.improve)}${ksColHTML('keep',bk.keep)}</div>`;
}
function scanKSByCategory(){
  const out=[];
  // ניהול הדרכה חטיבתי גפ"ה נחשבת קטגוריה אחת
  const gAvg=dimTopicAvg('gph','gph',gphCell);
  if(gAvg!=null) out.push({area:'ניהול הדרכה חטיבתי גפ"ה',dimLabel:'גפ"ה',avg:gAvg,cls:ksAuto(gAvg)});
  S.frameworks.forEach(f=>{
    FW_DIMS.forEach(dim=>{
      const avg=dimTopicAvg(f.id,dim,(a,b)=>fwCell(f.id,dim,a,b));
      if(avg==null)return;
      out.push({area:(f.label||'מסגרת'),dimLabel:DIM_META[dim].label,avg,cls:ksAuto(avg)});
    });
  });
  return out;
}

/* הנחיות לטיפול מיידי — מתוך הממצאים החלשים, מתועדפות */
function genDirectives(){
  const items=scanFindings().filter(x=>x.score!=null&&x.score<=69);
  items.sort((a,b)=>a.score-b.score);
  return items.map(x=>{
    const kb=kbOf(x.dim,x.name);
    const tag=x.score<60?'טיפול מיידי':'לטיפול';
    const fnd=x.find?` נמצא: ${x.find}.`:'';
    const ref=kb.ref?` (נוהל ${kb.ref})`:'';
    return `[${tag}] ${x.name} — ${x.scope} (ציון ${Math.round(x.score)}):${fnd} נדרש ${kb.fix}${ref}.`;
  });
}

/* סקירת מגמות — שימור / שיפור / המלצות, מתוך המאפיינים החוזרים */
function genTrends(){
  const p=detectPatterns();
  const keep=p.keep.length
    ? p.keep.map(x=>`• ${x.name} — נשמר ברמה גבוהה (ממוצע ${x.avg}) ב-${x.fw} מסגרות.`).join('\n') : '';
  const improve=p.improve.length
    ? p.improve.map(x=>`• ${x.name} — חוזר כפער ב-${x.fw} מסגרות (ממוצע ${x.avg}).`).join('\n') : '';
  const recs=p.improve.map(x=>{
    const parts=x.name.split(' · '); const name=parts[0]; const dim=SHORT2DIM[parts[1]]||'prog';
    const kb=kbOf(dim,name);
    return `• ${name}: ${kb.fix}${kb.ref?` (נוהל ${kb.ref})`:''}.`;
  }).join('\n');
  return {keep,improve,recs};
}

/* הערכה מסכמת — תמונת המצב הכוללת לפי הציונים והממדים */
function genSummary(){
  const ov=overallScore(); if(ov==null) return '';
  const ob=band(ov), gs=gphScore(), nf=S.frameworks.length;
  const ds=FW_DIMS.map(d=>({d,s:dimAvgAcrossFw(d),label:DIM_META[d].label})).filter(x=>x.s!=null);
  ds.sort((a,b)=>b.s-a.s);
  const fwWord=nf===1?'מסגרת אחת שנבדקה':nf+' מסגרות שנבדקו';
  let t=`ביקורת ההדרכה${S.meta.unit?' ביחידת '+S.meta.unit:''} העלתה ציון מסכם משוקלל של ${Math.round(ov)}/100 (${ob.t}), על בסיס ${fwWord}`;
  if(gs!=null) t+=` וניהול הדרכה חטיבתי גפ"ה שעמדה על ${Math.round(gs)}`;
  t+='. ';
  if(ds.length>=2){
    const best=ds[0], worst=ds[ds.length-1];
    if(Math.round(best.s)!==Math.round(worst.s))
      t+=`הממד החזק ביותר הוא ${best.label} (${Math.round(best.s)}), ואילו ${worst.label} (${Math.round(worst.s)}) מציב את האתגר המרכזי הדורש חיזוק. `;
  }
  t+=({
    good:'תמונת המצב הכוללת טובה ומשקפת עמידה רחבה בנהלי תקן "יסודות מנצחים"; הדגש הוא על שימור ההישגים והשלמת פערים נקודתיים.',
    mid:'תמונת המצב הכוללת סבירה ומשקפת עמידה חלקית בתקן; נדרש מאמץ ממוקד לסגירת הפערים שזוהו ולהעלאת האחידות בין המסגרות.',
    low:'תמונת המצב מצביעה על פערים מהותיים מול נהלי התקן, הדורשים תכנית התערבות מסודרת בליווי הדרג הממונה.'
  }[ob.k]||'');
  return t;
}

/* התייחסות כללית — מבט רוחבי: שונות בין מסגרות, סביבה וניהול ידע */
function genCrossCut(){
  const ov=overallScore(); if(ov==null) return '';
  let t='';
  const fs=S.frameworks.map(f=>fwScore(f.id)).filter(v=>v!=null);
  if(fs.length>=2){
    const spread=Math.round(Math.max.apply(null,fs)-Math.min.apply(null,fs));
    t += spread>=15
      ? `ניכרת שונות בין המסגרות (פער של כ-${spread} נק' בין הגבוהה לנמוכה), המעידה על יישום לא-אחיד של נהלי התקן ועל הזדמנות להאחדה ולהפצת שיטות עבודה טובות בין המסגרות. `
      : `רמת היישום בין המסגרות אחידה יחסית, המעידה על שגרת עבודה הדרכתית מבוססת ומשותפת. `;
  }
  t+='מומלץ לעגן את ממצאי הביקורת בתכנית עבודה מתעדכנת — עם אחראים ולוחות זמנים — ולשוב ולבחון את סגירת הפערים בבקרה הפנימית הבאה.';
  return t;
}

/* ----- חיווט לממשק ----- */
function confirmRepl(cur,msg){ return !(cur&&cur.trim())||confirm(msg||'קיים תוכן בשדה. להחליפו בטיוטה המחוללת?'); }
function genOne(which){
  if(which==='summary'){ const v=genSummary(); if(!v){toast('יש לבחור אפשרויות במסגרות לפני הניסוח');return;} if(!confirmRepl(S.report.summary))return; S.report.summary=v; }
  else if(which==='crossCut'){ const v=genCrossCut(); if(!v){toast('יש להזין ציונים במסגרות לפני הניסוח');return;} if(!confirmRepl(S.report.crossCut))return; S.report.crossCut=v; }
  else if(which==='directives'){ const lines=genDirectives(); if(!lines.length){toast('לא זוהו נושאים בציון נמוך הדורשים טיפול');return;}
    if(S.report.directives.some(d=>d.trim())&&!confirm('קיימות הנחיות שהוזנו. להחליפן בטיוטה המחוללת?'))return; S.report.directives=lines; }
  else if(which==='trends'){ const tr=genTrends(); if(!tr.keep&&!tr.improve){toast('טרם זוהו מגמות חוזרות (נדרשות שתי מסגרות ומעלה)');return;}
    if((S.report.trendsKeep+S.report.trendsImprove+S.report.recommendations).trim()&&!confirm('קיים תוכן בסקירת המגמות. להחליפו בטיוטה המחוללת?'))return;
    S.report.trendsKeep=tr.keep; S.report.trendsImprove=tr.improve; S.report.recommendations=tr.recs; }
  save(); render(); toast('נוסחה טיוטה — ניתנת לעריכה חופשית');
}
function genAll(){
  if(overallScore()==null){ toast('יש להזין ציונים במסגרות לפני הניסוח'); return; }
  const has=(S.report.summary+S.report.crossCut+S.report.trendsKeep+S.report.trendsImprove+S.report.recommendations).trim()||S.report.directives.some(d=>d.trim());
  if(has&&!confirm('לחולל טיוטות חדשות לכל הסעיפים? תוכן קיים בסעיפים אלו יוחלף.'))return;
  S.report.summary=genSummary();
  const dl=genDirectives(); if(dl.length) S.report.directives=dl;
  const tr=genTrends(); S.report.trendsKeep=tr.keep; S.report.trendsImprove=tr.improve; S.report.recommendations=tr.recs;
  save(); render(); toast('נוסחו טיוטות לכל הסעיפים — ניתנות לעריכה');
}

      const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));
      const mj=(a&bb)^(a&c)^(bb&c);
      const t2=(S0+mj)>>>0;
      hh=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=bb; bb=a; a=(t1+t2)>>>0;
    }
    h0=(h0+a)>>>0;h1=(h1+bb)>>>0;h2=(h2+c)>>>0;h3=(h3+d)>>>0;h4=(h4+e)>>>0;h5=(h5+f)>>>0;h6=(h6+g)>>>0;h7=(h7+hh)>>>0;
  }
  return [h0,h1,h2,h3,h4,h5,h6,h7].map(x=>x.toString(16).padStart(8,'0')).join('');
}

/* =====================================================================
   מאגר הנתונים — Firebase Firestore (ענן) או localStorage (גיבוי מקומי)
   שני המימושים חושפים אותו ממשק בדיוק
   ===================================================================== */
const K_LDEL = {__kdel:1};
function kNest(pairs, del){ const o={};
  pairs.forEach(([p,v])=>{ let c=o; for(let i=0;i<p.length-1;i++){ const k=p[i]; if(!c[k]||typeof c[k]!=='object'||Array.isArray(c[k])) c[k]={}; c=c[k]; }
    c[p[p.length-1]] = (v===undefined||v===K_LDEL) ? del : v; });
  return o; }

function kFireStore(){
  firebase.initializeApp(K_CFG);
  const db = firebase.firestore();
  try{ db.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}
  const C = n => db.collection(n);
  const track = p => { kPend(1); return p.then(r=>{ kPend(-1); kOnline(); return r; }, e=>{ kPend(-1); kCloudErr(e); throw e; }); };
  const err = e => kCloudErr(e);
  const all = s => { const o={}; s.forEach(d=>{ o[d.id]=d.data(); }); return o; };
  return {
    kind:'cloud',
    DEL: () => firebase.firestore.FieldValue.delete(),
    async ensureSeed(seed){
      const ref=C(K_COL.meta).doc('seed'); const s=await ref.get(); if(s.exists) return;
      const b=db.batch(); seed.forEach(u=>b.set(C(K_COL.users).doc(u.id), Object.assign({active:true},u), {merge:true}));
      b.set(ref,{v:1,at:Date.now()}); await track(b.commit()); },
    async findUserByHash(h){ const q=await C(K_COL.users).where('h','==',h).limit(1).get(); if(q.empty) return null;
      const d=q.docs[0]; return Object.assign({id:d.id}, d.data()); },
    listenUsers(cb){ return C(K_COL.users).onSnapshot(s=>{ cb(all(s)); kOnline(); }, err); },
    setUser(id,data){ return track(C(K_COL.users).doc(id).set(kclone(data),{merge:true})); },
    listenInsps(cb){ return C(K_COL.insp).onSnapshot(s=>{ cb(all(s)); kOnline(); }, err); },
    listenInsp(id,cb){ return C(K_COL.insp).doc(id).onSnapshot(d=>cb(d.exists?d.data():null, !!(d.metadata&&d.metadata.fromCache)), err); },
    listenFws(id,cb){ return C(K_COL.insp).doc(id).collection('fw').onSnapshot(s=>cb(all(s)), err); },
    setInsp(id,doc){ return track(C(K_COL.insp).doc(id).set(kclone(doc))); },
    mergeInsp(id,nested){ return track(C(K_COL.insp).doc(id).set(nested,{merge:true})); },
    mergeFw(id,fwId,nested){ return track(C(K_COL.insp).doc(id).collection('fw').doc(fwId).set(nested,{merge:true})); },
    delFw(id,fwId){ return track(C(K_COL.insp).doc(id).collection('fw').doc(fwId).delete()); },
    async delInsp(id){ const fs=await C(K_COL.insp).doc(id).collection('fw').get(); const b=db.batch();
      fs.forEach(d=>b.delete(d.ref)); b.delete(C(K_COL.insp).doc(id)); return track(b.commit()); },
  };
}

function kLocalStore(){
  const KEY='bkr_local_v1';
  let D=null; try{ D=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
  D = D || {users:{},insp:{},fw:{},meta:{}};
  const L = {users:new Set(), insps:new Set(), insp:{}, fws:{}};
  const persist = () => { try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(e){} };
  const merge = (t,s) => { for(const k in s){ const v=s[k];
    if(v===K_LDEL) delete t[k];
    else if(v&&typeof v==='object'&&!Array.isArray(v)){ if(!t[k]||typeof t[k]!=='object'||Array.isArray(t[k])) t[k]={}; merge(t[k],v); }
    else t[k]=kclone(v); } };
  const emit = () => setTimeout(()=>{
    L.users.forEach(f=>f(kclone(D.users))); L.insps.forEach(f=>f(kclone(D.insp)));
    Object.keys(L.insp).forEach(id=>L.insp[id].forEach(f=>f(kclone(D.insp[id]||null))));
    Object.keys(L.fws).forEach(id=>L.fws[id].forEach(f=>f(kclone(D.fw[id]||{}))));
  },0);
  const fire = () => { persist(); emit(); };
  window.addEventListener('storage', e=>{ if(e.key===KEY){ try{ D=JSON.parse(e.newValue)||D; }catch(x){} emit(); } });
  const sub = (map,id,cb,val) => { (map[id]=map[id]||new Set()).add(cb); setTimeout(()=>cb(val()),0); return ()=>map[id].delete(cb); };
  return {
    kind:'local', DEL: () => K_LDEL,
    async ensureSeed(seed){ if(D.meta.seed) return; seed.forEach(u=>{ D.users[u.id]=Object.assign({active:true},u); }); D.meta.seed={v:1}; fire(); },
    async findUserByHash(h){ const e=Object.entries(D.users).find(([id,u])=>u.h===h); return e?Object.assign({id:e[0]},kclone(e[1])):null; },
    listenUsers(cb){ L.users.add(cb); setTimeout(()=>cb(kclone(D.users)),0); return ()=>L.users.delete(cb); },
    async setUser(id,data){ D.users[id]=Object.assign(D.users[id]||{}, kclone(data)); fire(); },
    listenInsps(cb){ L.insps.add(cb); setTimeout(()=>cb(kclone(D.insp)),0); return ()=>L.insps.delete(cb); },
    listenInsp(id,cb){ return sub(L.insp,id,cb,()=>kclone(D.insp[id]||null)); },
    listenFws(id,cb){ return sub(L.fws,id,cb,()=>kclone(D.fw[id]||{})); },
    async setInsp(id,doc){ D.insp[id]=kclone(doc); fire(); },
    async mergeInsp(id,nested){ D.insp[id]=D.insp[id]||{}; merge(D.insp[id],nested); fire(); },
    async mergeFw(id,fwId,nested){ D.fw[id]=D.fw[id]||{}; D.fw[id][fwId]=D.fw[id][fwId]||{}; merge(D.fw[id][fwId],nested); fire(); },
    async delFw(id,fwId){ if(D.fw[id]) delete D.fw[id][fwId]; fire(); },
    async delInsp(id){ delete D.insp[id]; delete D.fw[id]; fire(); },
  };
}

/* כמה בקרים לאותה מסגרת: f.insps=[{uid,name,rank}] (תואם לאחור לשדה inspectorId הבודד) */
function kFwInsps(f){ if(!f) return []; if(Array.isArray(f.insps)) return f.insps.filter(x=>x&&(x.uid||x.name));
  return (f.inspectorId || f.inspName)?[{uid:f.inspectorId||'',name:f.inspName||'',rank:f.inspRank||''}]:[]; }
function kFwSetInsps(f,list){ f.insps=list; const a=list[0]; f.inspectorId=a?(a.uid||''):''; f.inspName=a?(a.name||''):''; f.inspRank=a?(a.rank||''):''; }
function kFwHas(f,uid){ return !!uid && kFwInsps(f).some(x=>x.uid===uid); }
function kFwNames(f){ return kFwInsps(f).map(x=>kUserName(x.uid,x.name)).join(', '); }

  const g=d.gphInspector; return g&&(g.uid||g.name)?[g]:[]; }

function kMyRoles(doc, uid){ uid=uid||kMe(); const r=[]; if(!doc) return r;
  (doc.frameworks||[]).forEach(f=>{ if(kFwHas(f,uid)) r.push({t:'fw',id:f.id,label:f.label||'מסגרת'}); });

function kRing(p, label){ const r=54, c=2*Math.PI*r;

    <div class="k-rv"><div><b>${p}%</b><small>${label||'הענף שלי'}</small></div></div></div>`; }
function kSortInsps(list){ const o={run:0,plan:1,done:2};
  return list.sort((a,b)=>{ const sa=kStatus(a[1]), sb=kStatus(b[1]); if(sa!==sb) return o[sa]-o[sb];
    const da=(a[1].meta||{}).dateFromISO||'9999', db=(b[1].meta||{}).dateFromISO||'9999'; return sa==='done'? db.localeCompare(da) : da.localeCompare(db); }); }

function kTimeline(list){
  const now=new Date(); const start=new Date(now.getFullYear(), now.getMonth()-3, 1), end=new Date(now.getFullYear(), now.getMonth()+4, 1);
  const span=end-start; const pos=d=>((d-start)/span*100);
  let html='<div class="k-ln"></div>';
  for(let i=0;i<7;i++){ const m=new Date(start.getFullYear(), start.getMonth()+i, 15); html+=`<span class="k-mon" style="right:${pos(m).toFixed(2)}%">${K_MON[m.getMonth()]}${m.getMonth()===0?' '+String(m.getFullYear()).slice(2):''}</span>`; }
  let last=-99;
  list.filter(([id,d])=>(d.meta||{}).dateFromISO).sort((a,b)=>a[1].meta.dateFromISO.localeCompare(b[1].meta.dateFromISO)).forEach(([id,d])=>{

function save(){ if(!KA.ws||!KA.ws.ready||!S) return; clearTimeout(KS.timer); KS.timer=setTimeout(kFlush, 350); }
function load(){}
function kDiffMap(cur,base,fn){ cur=cur||{}; base=base||{}; const keys=new Set([...Object.keys(cur),...Object.keys(base)]);
  keys.forEach(k=>{ if(kjson(cur[k])!==kjson(base[k])) fn(k,cur[k]); }); }
function kCellPairs(prefix,cur,base){ const isO=x=>x&&typeof x==='object'&&!Array.isArray(x);
  if(cur===undefined) return [[prefix,K_LDEL]]; if(!isO(cur)||!isO(base)) return [[prefix,kclone(cur)]];
  const out=[]; kDiffMap(cur,base,(k,v)=>out.push([prefix.concat(k), v===undefined?K_LDEL:kclone(v)])); return out; }
function kFlush(){
  clearTimeout(KS.timer); KS.timer=null;
  if(!KA.ws.id||!KS.base||!S) return;
  const id=KA.ws.id, base=KS.base, cur=kCore(S), store=KA.store, DEL=store.DEL();
  const main=[], fwP={}, denied=new Set(); let gphTouched=false; const touched=new Set();
  ['meta','frameworks','gphEnabled','gphInspector','gphInsps'].forEach(k=>{ if(kjson(cur[k])!==kjson(base[k])){ if(kIsAdmin()) main.push([[k],kclone(cur[k])]); else denied.add(k); } });
  kDiffMap(cur.gph,base.gph,(k,v)=>{ if(kCanScope('gph')){ main.push(...kCellPairs(['gph',k],v,(base.gph||{})[k])); gphTouched=true; } else denied.add('gph'); });
  kDiffMap(cur.topicNA,base.topicNA,(k,v)=>{ const sc=k.split('|')[0]; if(kCanScope(sc)){ main.push([['topicNA',k], v?v:K_LDEL]); if(sc==='gph') gphTouched=true; else touched.add(sc); } else denied.add('na'); });
  kDiffMap(cur.report,base.report,(k,v)=>{ if(kRepKeyOK(k)) main.push([['report',k], v===undefined?K_LDEL:kclone(v)]); else denied.add('report'); });
  Object.keys(cur.fw||{}).forEach(fid=>{ FW_DIMS.forEach(dim=>{
    kDiffMap((cur.fw[fid]||{})[dim], ((base.fw||{})[fid]||{})[dim], (k,v)=>{ if(kCanScope(fid)){ (fwP[fid]=fwP[fid]||[]).push(...kCellPairs([dim,k],v,(((base.fw||{})[fid]||{})[dim]||{})[k])); touched.add(fid); } else denied.add(fid); }); }); });
  const removed=Object.keys(base.fw||{}).filter(fid=>!(cur.fw||{})[fid]);
  if(gphTouched) main.push([['progress','gph'], kGphProg()]);
  touched.forEach(fid=>{ if(S.fw[fid]) main.push([['progress',fid], kFwProg(fid)]); });
  if(kIsAdmin()) removed.forEach(fid=>main.push([['progress',fid], K_LDEL]));
  if(main.length||Object.keys(fwP).length){ main.push([['updatedAt'],Date.now()]); main.push([['updatedBy'],kMe()]); }
  if(main.length) store.mergeInsp(id, kNest(main,DEL)).catch(()=>{});
  Object.entries(fwP).forEach(([fid,p])=>store.mergeFw(id,fid,kNest(p,DEL)).catch(()=>{}));
  if(kIsAdmin()) removed.forEach(fid=>store.delFw(id,fid).catch(()=>{}));
  if(denied.size){ S=kBuildS(KA.ws.doc, KA.ws.fws, S.ui); kRO(); setTimeout(render,0); }
  KS.base=kclone(kCore(S));
  if(KA.insps[id]){ const d=KA.insps[id]; if(gphTouched||touched.size){ d.progress=d.progress||{}; if(gphTouched) d.progress.gph=kGphProg(); touched.forEach(fid=>{ if(S.fw[fid]) d.progress[fid]=kFwProg(fid); }); } }
}
window.addEventListener('beforeunload', ()=>{ if(KS.timer) kFlush(); });

function cellState(cell){ return (cell && cell.score==null && cell.naMark) ? (cell.nc?'nc':'na') : null; }

function pickGph(_,ti,ci,k){ const c=DATA.gph[ti].crits[ci]; const cur=gphCell(ti,ci);
  if(cur&&cur.opt===k) setGph(ti,ci,{opt:null,score:null,naMark:false,nc:false});
  else { const o=critOpt(c,k); setGph(ti,ci,{opt:k,score:o?o.s:null,naMark:false,nc:false}); }
  refreshTopic('gph',ti); }

function ncGph(_,ti,ci){ const s=cellState(gphCell(ti,ci)); setGph(ti,ci,{opt:null,score:null,naMark:s!=='nc',nc:s!=='nc'}); refreshTopic('gph',ti); }
function pickFw(dim,ti,ci,k){ const c=DATA[dim][ti].crits[ci]; const fid=S.ui.activeFw; const cur=fwCell(fid,dim,ti,ci);
  if(cur&&cur.opt===k) setFw(fid,dim,ti,ci,{opt:null,score:null,naMark:false,nc:false});
  else { const o=critOpt(c,k); setFw(fid,dim,ti,ci,{opt:k,score:o?o.s:null,naMark:false,nc:false}); }
  refreshTopic(dim,ti); }
function naFw(dim,ti,ci){ const fid=S.ui.activeFw; const s=cellState(fwCell(fid,dim,ti,ci)); setFw(fid,dim,ti,ci,{opt:null,score:null,naMark:s!=='na',nc:false}); refreshTopic(dim,ti); }
function ncFw(dim,ti,ci){ const fid=S.ui.activeFw; const s=cellState(fwCell(fid,dim,ti,ci)); setFw(fid,dim,ti,ci,{opt:null,score:null,naMark:s!=='nc',nc:s!=='nc'}); refreshTopic(dim,ti); }

/* ---------- משקל אפקטיבי: משקל של פריט שהוצא מתפזר יחסית בין הנותרים ---------- */
function kPct(x){ const v=Math.round(x*1000)/10; return (Number.isInteger(v)?v:v.toFixed(1))+'%'; }
function effTopicW(scope,dim,ti){
  const topics=DATA[dim]; const t=topics[ti]; if(!t.scored||!t.w) return null;
  if(isTopicNA(scope,dim,ti)) return 0;
  let sum=0; topics.forEach((x,i)=>{ if(x.scored&&x.w&&!isTopicNA(scope,dim,i)) sum+=x.w; });
  return sum ? t.w/sum : null; }
function baseTopicW(dim,ti){ const topics=DATA[dim]; let sum=0; topics.forEach(x=>{ if(x.scored&&x.w) sum+=x.w; }); return sum?topics[ti].w/sum:0; }
function twHTML(scope,dim,ti){
  const t=DATA[dim][ti]; if(!t.w) return '';
  const b=baseTopicW(dim,ti), e=effTopicW(scope,dim,ti);
  if(e==null || Math.abs(e-b)<0.0005) return `<span class="tw">${kPct(b)}</span>`;
  return `<span class="tw ${e===0?'off':'chg'}" title="${e===0?'המשקל של הנושא פוזר בין שאר הנושאים':'המשקל עודכן — קיבל חלק ממשקל של נושא שהוצא מהחישוב'}"><s>${kPct(b)}</s>${kPct(e)}</span>`; }
function critWInfo(t,ti,ci,getter){
  const c=t.crits[ci]; if(c.w==null) return null;
  let all=0, live=0, any=false;
  t.crits.forEach((x,i)=>{ if(x.w==null) return; all+=x.w; if(cellState(getter(ti,i))) any=true; else live+=x.w; });
  if(!any) return null;
  const b=all?c.w/all:0, e=cellState(getter(ti,ci))?0:(live?c.w/live:0);
  return {b,e}; }

/* ---------- רינדור נושא ושאלה ---------- */
let RT_CTX=null;
function renderTopic(dimKey,topics,ti,getter,onScore,onNA,scope){
  const t=topics[ti];
  const st=topicState(scope,dimKey,ti), na=!!st;
  let done=0,tot=0;
  t.crits.forEach((c,ci)=>{ if(c.w==null)return; tot++; const cell=getter(ti,ci); if(cell&&cell.score!=null)done++; });
  const ts=(t.scored&&!na)? topicScore(t,(ci)=>getter(ti,ci)) : null;
  const b=band(ts);
  const open = t._open?'open':'';
  const tscoreHtml = na ? `<span class="tscore st-${st}">${ST_LBL[st]}</span>`
    : t.scored ? `<span class="tscore ${b.k?'bg-'+b.k:''}">${ts==null?'—':Math.round(ts)}</span>`
    : `<span class="tscore" style="background:var(--bg2);color:var(--muted);font-size:11px">איכותי</span>`;
  const ic='<circle cx="12" cy="12" r="10"/><path d="M4.9 4.9l14.2 14.2"/>';
  const icNc='<circle cx="12" cy="12" r="10"/><path d="M12 7v5l3 2"/>';
  const topicTools=`<div class="topic-tools" onclick="event.stopPropagation()">
      <button class="tt-btn ${st==='na'?'on':''}" onclick="toggleTopicNA('${scope}','${dimKey}',${ti})" title="הנושא לא רלוונטי למסגרת — יוצא מהחישוב והמשקל שלו מתפזר בין שאר הנושאים">${svg(ic)}לא רלוונטי</button>
      <button class="tt-btn nc ${st==='nc'?'on':''}" onclick="toggleTopicNC('${scope}','${dimKey}',${ti})" title="הנושא לא נבדק בביקורת — יוצא מהחישוב והמשקל שלו מתפזר בין שאר הנושאים">${svg(icNc)}לא נבדק</button>
    </div>`;
  RT_CTX={scope,getter,t,onNA};
  const crits=t.crits.map((c,ci)=>renderCrit(dimKey,ti,ci,c,getter(ti,ci),onScore,onNA)).join('');
  RT_CTX=null;
  return `<div class="topic ${open} ${na?'topic-na':''}" id="tp_${dimKey}_${ti}">
    <div class="topic-head" onclick="toggleTopic('${dimKey}',${ti})">
      <span class="tnum">${ti+1}</span>
      ${twHTML(scope,dimKey,ti)}
      <h4>${esc(t.name)}</h4>
      ${(t.scored&&!na)?ksTagHTML(scope,dimKey,ti,ts):''}
      ${tot?`<span class="tprog">${done}/${tot}</span>`:''}
      ${tscoreHtml}
      <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="topic-body">
      ${topicTools}
      ${(t.scored&&!na)?ksPickerHTML(scope,dimKey,ti,ts):''}
      ${na?`<p class="muted" style="font-size:13px;padding:4px 2px 12px">הנושא סומן כ<b>${ST_LBL[st]}</b> ואינו נכלל בחישוב הציון. המשקל שלו (${kPct(baseTopicW(dimKey,ti))}) פוזר בין שאר הנושאים בממד, יחסית למשקל של כל אחד.</p>`:''}
      ${crits}
      <button class="tp-close" onclick="closeTopic('${dimKey}',${ti})">${kic('up')}סגירת הנושא</button>
    </div>
  </div>`;
}
function renderCrit(dimKey,ti,ci,c,cell,onPick,onNA){
  const opts = c.opts||[];
  const scored = c.w!=null;
  const curOpt = cell&&cell.opt!=null ? cell.opt : null;
  const st = cellState(cell);
  const filled = curOpt!=null;
  const onNC = String(onNA).replace(/^na/,'nc');
  const optsHTML = `<div class="opts">${opts.map(o=>{
      const on = curOpt===o.k;
      const vc = o.s==null?'v-none':o.s>=80?'v-good':o.s>=60?'v-mid':'v-low';
      const badge = o.s==null ? `<span class="osc none">ללא ציון</span>` : `<span class="osc">${o.s}</span>`;
      return `<button class="opt ${on?'on '+vc:''}" onclick="${onPick}('${dimKey}',${ti},${ci},'${o.k}')">
        <span class="ok">${o.k}</span><span class="otx">${fnText(o.t,o.fn)}</span>${badge}</button>`;}).join('')}</div>
    <div class="na-row"><button class="score-na ${st==='na'?'on':''}" onclick="${onNA}('${dimKey}',${ti},${ci})">לא רלוונטי</button>
    <button class="score-na nc ${st==='nc'?'on':''}" onclick="${onNC}('${dimKey}',${ti},${ci})">לא נבדק</button></div>`;
  const tag = c.bonus ? `<span class="crit-bonus">${svg(SPARK)}שאלת בונוס</span>`
            : !scored ? `<span class="crit-doconly">${svg(ICONS.note)}לתיעוד בלבד — אינו משוקלל בציון</span>` : '';
  let wchip='';
  if(RT_CTX){ const w=critWInfo(RT_CTX.t,ti,ci,RT_CTX.getter);
    if(w) wchip = w.e===0 ? `<span class="cw off" title="השאלה הוצאה מהחישוב — המשקל שלה פוזר בין שאר השאלות בנושא">${ST_LBL[st]} · <s>${kPct(w.b)}</s>0%</span>`
      : `<span class="cw chg" title="משקל השאלה בתוך הנושא, אחרי פיזור המשקל של שאלות שהוצאו">משקל בנושא <s>${kPct(w.b)}</s>${kPct(w.e)}</span>`; }
  return `<div class="crit ${filled?'filled':''} ${st?'crit-'+st:''}" id="cr_${dimKey}_${ti}_${ci}">
    <div class="ct"><span class="cnum">${ti+1}.${ci+1}</span>${fnText(c.t,c.fn)}${tag}${wchip}</div>
    <div class="cmeta">
      ${c.c?`<span>${svg(ICONS.talk)}${esc(c.c)}</span>`:''}
      ${c.note?`<span class="note">${svg(ICONS.note)}${esc(c.note)}</span>`:''}
    </div>
    <div class="score-row">${optsHTML}</div>
  </div>`;
}
function refreshTopic(dimKey,ti){
  const isG=dimKey==='gph';
  const scope=isG?'gph':S.ui.activeFw;
  const getter=isG? gphCell : (a,b)=>fwCell(S.ui.activeFw,dimKey,a,b);
  const el=document.getElementById('tp_'+dimKey+'_'+ti);
  if(el){ const tmp=document.createElement('div');
    tmp.innerHTML=renderTopic(dimKey,DATA[dimKey],ti,getter,isG?'pickGph':'pickFw',isG?'naGph':'naFw',scope);
    el.replaceWith(tmp.firstElementChild); }
  renderNav();
  if(nav==='fw'){
    document.querySelectorAll('.dimbar button').forEach((btn,i)=>{ const d=FW_DIMS[i]; const p=dimProgress((a,b)=>fwCell(S.ui.activeFw,d,a,b),DATA[d]);
      const mini=btn.querySelector('.mini'); if(mini)mini.textContent=`${p.done}/${p.tot}${p.pct===100?' ✓':''}`; btn.classList.toggle('done',p.pct===100); });
    document.querySelectorAll('.fws-item').forEach((it,i)=>{ const val=i<FW_DIMS.length?fwDimScore(S.ui.activeFw,FW_DIMS[i]):fwScore(S.ui.activeFw);

}
function closeTopic(dimKey,ti){
  const el=document.getElementById('tp_'+dimKey+'_'+ti); if(!el) return;
  DATA[dimKey][ti]._open=false; el.classList.remove('open');
  const r=el.getBoundingClientRect(); if(r.top<80 || r.top>window.innerHeight-80) el.scrollIntoView({behavior:'smooth',block:'center'});
}

/* ---------- דו"ח: מספור וסימון נושאים שהוצאו ---------- */
function findingsTable(dimKey,topics,getter){
  const dim = dimKey==='gph'?'gph':dimKey;
  const scope = dimKey==='gph' ? 'gph' : (S.frameworks.find(f=>getter===f._g)||{}).id;
  const rows=topics.map((t,ti)=>{
    if(!t.scored) return '';
    const st = scope ? topicState(scope,dim,ti) : null;
    if(st) return `<tr class="ftopic"><td><b>${ti+1}. ${esc(t.name)}</b></td><td class="c muted">${ST_LBL[st]}</td><td class="c">—</td></tr>`;
    const ts=topicScore(t,(ci)=>getter(ti,ci));
    const crits=topicCrits(dim,ti,getter);
    if(ts==null&&!crits.length) return '';
    const head=`<tr class="ftopic"><td><b>${ti+1}. ${esc(t.name)}</b></td><td class="c">—</td>
      <td class="c"><b>${ts==null?'—':Math.round(ts)}</b></td></tr>`;
    const sub=crits.map(c=>`<tr><td class="fsub">${ti+1}.${c.ci+1} ${esc(c.t)}</td>
      <td>${esc(c.optText)}</td><td class="c">${c.score==null?'—':c.score}</td></tr>`).join('');
    return head+sub;
  }).filter(Boolean).join('');
  if(!rows) return '';
  return `<table class="rtable"><thead><tr><th style="width:34%">נושא / תת-נושא</th>
    <th>התשובה שנבחרה</th><th style="width:9%" class="c">ציון</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function frameworkFindings(f){
  const parts=FW_DIMS.map(d=>{
    const g=(ti,ci)=>fwCell(f.id,d,ti,ci); f._g=g;
    const tbl=findingsTable(d,DATA[d],g); delete f._g;
    if(!tbl)return '';
    const s=fwDimScore(f.id,d);
    return `<div class="subhead" style="font-size:13.5px;margin-top:13px">ממד ${DIM_META[d].label} ${s!=null?`<span class="pill bg-${band(s).k}">${Math.round(s)}</span>`:''}</div>${tbl}`;
  }).filter(Boolean).join('');
  if(!parts) return '';
  const who=kFwLabels(f);
  return `<div class="subhead" style="margin-top:20px;font-size:15px;border-top:1px solid var(--line);padding-top:14px">מסגרת ${esc(f.label||'')} <span class="pill bg-${band(fwScore(f.id)).k}">${fmt(fwScore(f.id))}</span></div>${who?`<p class="muted" style="font-size:12.5px;margin:2px 0 4px">נבדקה ע"י: ${esc(who)}</p>`:''}${parts}`;
}

/* ---------- שאלות שלא נענו (מסך העיבוד) ---------- */
const UQ_OPEN={};
function unansweredList(){
  const out=[];
  const scan=(scope,dim,getter)=>{ (DATA[dim]||[]).forEach((t,ti)=>{ if(isTopicNA(scope,dim,ti)) return;
    t.crits.forEach((c,ci)=>{ if(c.w==null) return; if(cellAnswered(getter(ti,ci))) return; out.push({scope,dim,ti,ci}); }); }); };
  if(S.gphEnabled) scan('gph','gph',gphCell);
  S.frameworks.forEach(f=>FW_DIMS.forEach(d=>scan(f.id,d,(a,b)=>fwCell(f.id,d,a,b))));
  return out; }
function uqHTML(){
  const list=unansweredList();
  if(!list.length) return `<div class="uq ok" id="uqbox"><div class="uq-h">${kic('check')}<div><b>כל השאלות נענו</b><span>בכל המסגרות והממדים נבחרה תשובה או סימון "לא רלוונטי" / "לא נבדק".</span></div></div></div>`;
  const groups=[]; const gi={};
  list.forEach(x=>{ const k=x.scope; if(!gi[k]){ gi[k]={scope:x.scope,items:[]}; groups.push(gi[k]); } gi[k].items.push(x); });
  const me=kMe(); const openAll=list.length<=12;
  const body=groups.map(g=>{
    const isG=g.scope==='gph'; const f=isG?null:S.frameworks.find(x=>x.id===g.scope);
    const mine=isG?kGphHas(S,me):kFwHas(f,me);
    const title=isG?'ניהול הדרכה חטיבתי גפ"ה':esc(f.label||'מסגרת');
    const key=g.scope; const open = UQ_OPEN[key]!=null ? UQ_OPEN[key] : (openAll||mine);
    const dimCnt=isG?'':FW_DIMS.map(d=>{ const n=g.items.filter(x=>x.dim===d).length; return n?`<span class="uq-dc">${DIM_META[d].short} ${n}</span>`:''; }).join('');
    let lastD='', lastT=-1; const rows=g.items.map(x=>{ const t=DATA[x.dim][x.ti]; let h='';
      if(!isG && x.dim!==lastD){ h+=`<div class="uq-d">${DIM_META[x.dim].label}</div>`; lastD=x.dim; lastT=-1; }
      if(x.ti!==lastT){ h+=`<div class="uq-t"><span>${x.ti+1}</span>${esc(t.name)}</div>`; lastT=x.ti; }
      return h+`<button class="uq-q" onclick="goQ('${x.scope}','${x.dim}',${x.ti},${x.ci})"><span class="cnum">${x.ti+1}.${x.ci+1}</span><span class="uq-tx">${esc(t.crits[x.ci].t)}</span>${kic('chev','uq-go')}</button>`; }).join('');
    return `<details class="uq-g" ${open?'open':''} ontoggle="UQ_OPEN['${key}']=this.open"><summary>${kic('down','uq-car')}<b>${title}</b>${mine?'<span class="k-own">שלך</span>':''}<span class="uq-dcs">${dimCnt}</span><span class="uq-n">${g.items.length}</span></summary><div class="uq-list">${rows}</div></details>`;
  }).join('');
  return `<div class="uq" id="uqbox"><div class="uq-h">${kic('alert')}<div><b>${list.length===1?'נותרה שאלה אחת שלא נענתה':`נותרו ${list.length} שאלות שלא נענו`}</b><span>לחיצה על שאלה מעבירה ישר אליה. שאלה נחשבת "נענתה" אם נבחרה תשובה או סומן "לא רלוונטי" / "לא נבדק".</span></div></div>${body}</div>`;
}

/* ---------- תזכורת לבקרים משובצים ---------- */
function kAssignAt(doc,uid){ let at=0;
  (doc.frameworks||[]).forEach(f=>kFwInsps(f).forEach(x=>{ if(x.uid===uid) at=Math.max(at, x.at||doc.createdAt||1); }));
  if(doc.gphEnabled) kGphInsps(doc).forEach(x=>{ if(x.uid===uid) at=Math.max(at, x.at||doc.createdAt||1); });
  return at; }
function kSeenAt(doc,uid){ return ((doc&&doc.seenBy)||{})[uid]||0; }
function kIsNewFor(doc,uid){ uid=uid||kMe(); const at=kAssignAt(doc,uid); return at>0 && kStatus(doc)!=='done' && kSeenAt(doc,uid)<at; }
function kNewList(){ return kSortInsps(Object.entries(KA.insps).filter(([id,d])=>kIsNewFor(d))); }
function kMarkSeen(id){ const d=KA.insps[id]||(KA.ws&&KA.ws.doc); if(!d||!kMe()||!kAssignAt(d,kMe())) return; if(!kIsNewFor(d)) return;
  const now=Date.now(); if(KA.insps[id]){ KA.insps[id].seenBy=Object.assign({},KA.insps[id].seenBy,{[kMe()]:now}); }
  KA.store.mergeInsp(id,{seenBy:{[kMe()]:now}}).catch(()=>{}); kNewBadge(); }
const _nWsApply=kWsApply; kWsApply=function(){ _nWsApply.apply(this,arguments); if(KA.ws&&KA.ws.ready&&KA.ws.id) kMarkSeen(KA.ws.id); };
function kNewBadge(){ const n=kNewList().length;
  document.querySelectorAll(`a[onclick="kGo('mine')"]`).forEach(a=>{ let i=a.querySelector('.k-nbadge'); if(!n){ if(i) i.remove(); return; }
    if(!i){ i=document.createElement('i'); i.className='k-nbadge'; a.appendChild(i); } i.textContent=n; }); }
const _nRender=kRender; kRender=function(){ _nRender.apply(this,arguments); kNewBadge(); };
let K_NEW_TOASTED=false;
const _nLive=kLiveRefresh; kLiveRefresh=function(kind){ _nLive.apply(this,arguments); kNewBadge();
  if(kind==='insps' && !K_NEW_TOASTED && KA.inspsReady){ K_NEW_TOASTED=true; const n=kNewList().length; if(n) toast(n===1?'שובצת לביקורת חדשה':`שובצת ל-${n} ביקורות חדשות`); } };

function kDocFor(id){ if(KA.ws&&KA.ws.id===id&&S&&KA.ws.ready) return Object.assign({},KA.insps[id]||{},{meta:S.meta,frameworks:S.frameworks,gphEnabled:S.gphEnabled,gphInsps:S.gphInsps,gphInspector:S.gphInspector}); return KA.insps[id]; }
function kRemindWa(id,uid){ const d=kDocFor(id); if(!d) return; window.open('https://wa.me/?text='+encodeURIComponent(kRemindText(d,id,uid)),'_blank'); }
function kRemindCopy(id,uid,btn){ const d=kDocFor(id); if(!d) return; const t=kRemindText(d,id,uid);

  else prompt('העתיקו את ההודעה:',t); }
function kTeamOf(doc){ const ids=[]; const add=uid=>{ if(uid&&!ids.includes(uid)) ids.push(uid); };
  if(doc.gphEnabled) kGphInsps(doc).forEach(x=>add(x.uid)); (doc.frameworks||[]).forEach(f=>kFwInsps(f).forEach(x=>add(x.uid))); return ids; }
function kRemindModal(id, fresh){ const d=kDocFor(id); if(!d) return; const team=kTeamOf(d);
  const rows=team.map(uid=>{ const u=KA.users[uid]||{}; const roles=kMyRoles(d,uid).filter(r=>r.t!=='cmd').map(r=>r.label).join(' · ');
    const seen=kSeenAt(d,uid)>=kAssignAt(d,uid);
    return `<div class="k-rm-r">${kAv(u.name||'?')}<div class="k-rm-n"><b>${kesc(kFull(u)||u.name||'')}</b><small>${kesc(roles)}</small></div>
      <span class="k-rm-st ${seen?'ok':''}">${seen?kic('check')+'נכנס/ה לביקורת':'טרם נכנס/ה'}</span>
      <button class="k-btn k-btn-sm k-wa" onclick="kRemindWa('${id}','${uid}')" title="שליחת תזכורת בוואטסאפ">${kic('wa')}וואטסאפ</button>
      <button class="k-btn k-btn-g k-btn-sm k-cp" onclick="kRemindCopy('${id}','${uid}',this)" title="העתקת ההודעה">${kic('copy')}</button></div>`; }).join('');
  kModal(`<h3>${fresh?'הביקורת נשמרה · תזכורת לבקרים':'תזכורת לבקרים המשובצים'}</h3>
    <p class="k-sub">כל בקר רואה התראה במערכת כשהוא נכנס. אפשר גם לשלוח לו הודעת וואטסאפ מוכנה עם פרטי הביקורת והקישור, או להעתיק אותה.</p>
    ${team.length?`<div class="k-rm">${rows}</div>`:'<p class="k-muted">עוד לא שובצו בקרים בביקורת הזו.</p>'}
    <div class="k-acts"><button class="k-btn k-btn-p" onclick="kModalClose()">סגירה</button></div>`); }
/* כפתור תזכורת ליד כל בקר משובץ, כרטיס תזכורות במסך פרטי הביקורת, וחלון תזכורת אחרי יצירת ביקורת */
function kChipWa(uid){ return `<button class="k-chip-wa" onclick="kRemindWa(KA.ws.id,'${uid}')" title="תזכורת בוואטסאפ" aria-label="תזכורת בוואטסאפ">${kic('wa')}</button>`; }
const _rHome=viewHome; viewHome=function(v){ _rHome(v); if(!kIsAdmin()||!KA.ws||!KA.ws.id) return;
  const sec=v.querySelector('.k-danger'); const n=kTeamOf(kDocFor(KA.ws.id)||{}).length;
  const card=`<div class="k-card k-remind"><span class="k-new-ic">${kic('bell')}</span><div><b>תזכורת לבקרים</b>${n?`${n} בקרים משובצים · אפשר לראות מי כבר נכנס לביקורת ולשלוח תזכורת בוואטסאפ`:'עוד לא שובצו בקרים'}</div>
    <button class="k-btn k-btn-p k-btn-sm" ${n?'':'disabled'} onclick="kRemindModal(KA.ws.id)">${kic('wa')}שליחת תזכורת</button></div>`;
  if(sec) sec.insertAdjacentHTML('beforebegin',card); else v.insertAdjacentHTML('beforeend',card); };
const _rCreate=kCreate; kCreate=function(){ const before=new Set(Object.keys(KA.insps)); _rCreate.apply(this,arguments);
  const id=Object.keys(KA.insps).find(k=>!before.has(k)); if(id && kTeamOf(KA.insps[id]).length) setTimeout(()=>kRemindModal(id,true),250); };

/* הרשאות — עטיפה מחדש של הפונקציות שהוגדרו כאן */
_kGuard('pickGph', ()=>kCanScope('gph')); _kGuard('naGph', ()=>kCanScope('gph')); _kGuard('ncGph', ()=>kCanScope('gph'));
_kGuard('pickFw', ()=>kCanScope(S.ui.activeFw)); _kGuard('naFw', ()=>kCanScope(S.ui.activeFw)); _kGuard('ncFw', ()=>kCanScope(S.ui.activeFw));
_kGuard('toggleTopicNA', (scope)=>kCanScope(scope)); _kGuard('toggleTopicNC', (scope)=>kCanScope(scope));


/* =====================================================================
   בעלי תפקידים — איסוף לפי בעל תפקיד במקום ממדים, הכרעה בתשובות סותרות,
   ציונים, עיבוד ודו"ח לפי בעלי תפקידים
   ---------------------------------------------------------------------
   • כל בעל תפקיד עונה על השאלות שלו. התשובות נשמרות בנפרד:
       S.fw[fid].r  { 'role|dim|ti_ci' : cell }     S.gphR { 'role|ti_ci' : cell }
   • תשובה סופית לשאלה = תשובה שכולם הסכימו עליה, או תשובה שהבקר בחר:
       S.fw[fid].pk { 'dim|ti_ci' : role }            S.gphPk { 'ti_ci' : role }
     עד שבוחרים — השאלה לא נכנסת לציון.
   • fwCell / gphCell מחזירות את התשובה הסופית, ולכן ציון המסגרת, הגפ"ה,
     המגמות וריכוז השיפור/שימור מחושבים כמו קודם.
   • ציון בעל תפקיד מחושב מהתשובות של בעל התפקיד עצמו.
   ===================================================================== */
const ROLE_LBL={
  fw:{mgd:'מג"ד/רע"ן', mp:'ממ"ג/מ"פ', mm:'מ"מים/מ"כים', tr:'חניכים'},
  gph:{sc:'מפקד ביה"ס', mgd:'מג"ד/רע"ן', gpo:'מפקדת גפ"ה'}
};
const FW_ROLES=['mgd','mp','mm','tr'], GPH_ROLES=['sc','mgd','gpo'];
/* '3' = כל נושא 3 · '1.3' = שאלה 1.3 · '*' = כל השאלות. המספור לפי השאלון המעודכן */
const ROLE_SPEC={
  gph:{ sc:{gph:['3','4','5','7','8']}, mgd:{gph:['1']}, gpo:{gph:['2','6','9']} },
  fw:{
    mgd:{prog:['1','2','4','5','9'], cmd:['2','3','4','5'], trainee:['1.3','5']},
    mp:{prog:['*'], cmd:['*'], trainee:['*']},
    mm:{prog:['3','5.5','6','7.2','7.3','8.2','8.3','8.4','8.5'], cmd:['1.1','1.3','1.4','2','3','4'], trainee:['1','2','3','4','5']},
    tr:{prog:['3','8.3','8.5'], trainee:['1.2','1.3','2','3','4']}
  }
};
const K_HAS={};
Object.entries(ROLE_SPEC).forEach(([kind,roles])=>Object.entries(roles).forEach(([role,dims])=>Object.entries(dims).forEach(([dim,list])=>{
  const set=new Set();
  (DATA[dim]||[]).forEach((t,ti)=>t.crits.forEach((c,ci)=>{
    if(list.includes('*')||list.includes(String(ti+1))||list.includes((ti+1)+'.'+(ci+1))) set.add(ti+'_'+ci); }));
  K_HAS[kind+'|'+role+'|'+dim]=set; })));
let K_FILTER=null, K_CC=null;

function kKind(dim){ return dim==='gph'?'gph':'fw'; }
function kRolesOf(kind){ return kind==='gph'?GPH_ROLES:FW_ROLES; }
function kRoleLbl(kind,r){ return (ROLE_LBL[kind]||{})[r]||r; }
function kHas(kind,role,dim,ti,ci){ const s=K_HAS[kind+'|'+role+'|'+dim]; return !!(s&&s.has(ti+'_'+ci)); }
function kRoleDims(kind,role){ return kind==='gph'?['gph']:FW_DIMS.filter(d=>{ const s=K_HAS['fw|'+role+'|'+d]; return s&&s.size; }); }
function kQRoles(dim,ti,ci){ const kind=kKind(dim); return kRolesOf(kind).filter(r=>kHas(kind,r,dim,ti,ci)); }
function kRoleQCount(kind,role){ let n=0; kRoleDims(kind,role).forEach(d=>{ const s=K_HAS[kind+'|'+role+'|'+d]; if(s) n+=s.size; }); return n; }

/* ---------- אחסון תשובות בעלי התפקידים ---------- */
function kRKey(kind,role,dim,ti,ci){ return kind==='gph'? role+'|'+ti+'_'+ci : role+'|'+dim+'|'+ti+'_'+ci; }
function kQKey(dim,ti,ci){ return dim==='gph'? ti+'_'+ci : dim+'|'+ti+'_'+ci; }
function kRStore(kind,fid,create){
  if(kind==='gph'){ if(!S.gphR&&create) S.gphR={}; return S.gphR||{}; }
  let f=S.fw[fid]; if(!f){ if(!create) return {}; f=S.fw[fid]={}; } if(!f.r&&create) f.r={}; return f.r||{}; }
function kPStore(kind,fid,create){
  if(kind==='gph'){ if(!S.gphPk&&create) S.gphPk={}; return S.gphPk||{}; }
  let f=S.fw[fid]; if(!f){ if(!create) return {}; f=S.fw[fid]={}; } if(!f.pk&&create) f.pk={}; return f.pk||{}; }
function kRCell(kind,fid,role,dim,ti,ci){ if(!kHas(kind,role,dim,ti,ci)) return null; return kRStore(kind,fid)[kRKey(kind,role,dim,ti,ci)]||null; }
function kSetR(kind,fid,role,dim,ti,ci,patch){
  const st=kRStore(kind,fid,true), k=kRKey(kind,role,dim,ti,ci);
  const v=Object.assign({score:null,opt:null},st[k],patch);
  if(v.opt==null&&!v.naMark) delete st[k]; else st[k]=v;
  save(); }

/* ---------- תשובה סופית ---------- */
function kSig(c){ return !c?'':c.opt!=null?'o'+c.opt:c.naMark?(c.nc?'nc':'na'):''; }
function kQInfo(dim,ti,ci,fid){
  const kind=kKind(dim);
  let list=kQRoles(dim,ti,ci).map(r=>({r,c:kRCell(kind,fid,r,dim,ti,ci)})).filter(x=>kSig(x.c));
  const real=list.filter(x=>kSig(x.c)!=='nc'); if(real.length) list=real;    // "לא נבדק" אצל בעל תפקיד אחד אינו סתירה
  if(!list.length) return {list,conflict:false,pick:null,cell:null};
  const sigs=new Set(list.map(x=>kSig(x.c)));
  if(sigs.size===1) return {list,conflict:false,pick:null,cell:list[0].c};
  const pick=kPStore(kind,fid)[kQKey(dim,ti,ci)]||null;
  const p=list.find(x=>x.r===pick);
  return {list,conflict:true,pick:p?pick:null,cell:p?p.c:null}; }
function fwCell(fwId,dim,ti,ci){ return kQInfo(dim,ti,ci,fwId).cell; }
function gphCell(ti,ci){ return kQInfo('gph',ti,ci,null).cell; }

/* ---------- ציון והתקדמות של בעל תפקיד (מהתשובות שלו עצמו) ---------- */
function kRoleGetter(kind,fid,role,dim){ return (ti,ci)=>kRCell(kind,fid,role,dim,ti,ci); }
function kRoleScore(kind,fid,role){
  const scope=kind==='gph'?'gph':fid;
  const vals=kRoleDims(kind,role).map(d=>dimScore(scope,d,DATA[d],kRoleGetter(kind,fid,role,d))).filter(v=>v!=null);
  return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null; }
function kRoleAvg(role){ const v=S.frameworks.map(f=>kRoleScore('fw',f.id,role)).filter(x=>x!=null); return v.length?v.reduce((a,b)=>a+b,0)/v.length:null; }
function kRoleProg(kind,fid,role){
  let done=0,tot=0; const scope=kind==='gph'?'gph':fid;
  kRoleDims(kind,role).forEach(d=>DATA[d].forEach((t,ti)=>{ if(fid!==undefined&&isTopicNA(scope,d,ti)) return;
    t.crits.forEach((c,ci)=>{ if(c.w==null||!kHas(kind,role,d,ti,ci)) return; tot++; if(cellAnswered(kRCell(kind,fid,role,d,ti,ci))) done++; }); }));
  return {done,tot,pct:tot?Math.round(done/tot*100):0}; }
function kFwProg(fid){ const o={pct:0,r:{}}; let d=0,t=0;
  FW_ROLES.forEach(r=>{ const p=kRoleProg('fw',fid,r); o.r[r]=[p.done,p.tot]; d+=p.done; t+=p.tot; });
  o.pct=t?Math.round(d/t*100):0; return o; }
function kGphProg(){ let d=0,t=0; GPH_ROLES.forEach(r=>{ const p=kRoleProg('gph',null,r); d+=p.done; t+=p.tot; });
  return {pct:t?Math.round(d/t*100):0,done:d,tot:t}; }

/* ---------- בחירה במסכי האיסוף ---------- */
function kCurRole(dim){ return dim==='gph'
  ? (GPH_ROLES.includes(S.ui.grole)?S.ui.grole:GPH_ROLES[0])
  : (FW_ROLES.includes(S.ui.role)?S.ui.role:FW_ROLES[0]); }
function kCtx(dim){ const kind=kKind(dim); return {kind, fid:kind==='gph'?null:S.ui.activeFw, role:kCurRole(dim)}; }
function pickR(dim,ti,ci,k){ const x=kCtx(dim); const c=DATA[dim][ti].crits[ci]; const cur=kRCell(x.kind,x.fid,x.role,dim,ti,ci);
  if(cur&&cur.opt===k) kSetR(x.kind,x.fid,x.role,dim,ti,ci,{opt:null,score:null,naMark:false,nc:false});
  else { const o=critOpt(c,k); kSetR(x.kind,x.fid,x.role,dim,ti,ci,{opt:k,score:o?o.s:null,naMark:false,nc:false}); }
  refreshTopic(dim,ti); }
function naR(dim,ti,ci){ const x=kCtx(dim); const s=cellState(kRCell(x.kind,x.fid,x.role,dim,ti,ci));
  kSetR(x.kind,x.fid,x.role,dim,ti,ci,{opt:null,score:null,naMark:s!=='na',nc:false}); refreshTopic(dim,ti); }
function ncR(dim,ti,ci){ const x=kCtx(dim); const s=cellState(kRCell(x.kind,x.fid,x.role,dim,ti,ci));
  kSetR(x.kind,x.fid,x.role,dim,ti,ci,{opt:null,score:null,naMark:s!=='nc',nc:s!=='nc'}); refreshTopic(dim,ti); }
function selRole(r){ S.ui.role=r; render(); window.scrollTo(0,0); }
function selGRole(r){ S.ui.grole=r; render(); window.scrollTo(0,0); }

/* תגיות ליד שאלה: אצל מי עוד היא נשאלת, והאם יש תשובה שונה */
function kShareChip(dim,ti,ci){
  if(!K_CC) return ''; const {kind,fid,role}=K_CC;
  const others=kQRoles(dim,ti,ci).filter(r=>r!==role); if(!others.length) return '';
  let h=`<span class="k-share" title="השאלה נשאלת גם את בעלי התפקידים האלה">${kic('users')}גם אצל: ${others.map(r=>kRoleLbl(kind,r)).join(', ')}</span>`;
  const ms=kSig(kRCell(kind,fid,role,dim,ti,ci));
  if(ms&&ms!=='nc'){
    const diff=others.filter(r=>{ const s=kSig(kRCell(kind,fid,r,dim,ti,ci)); return s&&s!=='nc'&&s!==ms; });
    if(diff.length){ const q=kQInfo(dim,ti,ci,fid);
      h+= q.pick ? `<span class="k-diff ok">${kic('check')}${q.pick===role?'התשובה הזו נבחרה לדו"ח':'נבחרה לדו"ח התשובה של '+kRoleLbl(kind,q.pick)}</span>`
                 : `<span class="k-diff" title="הבחירה איזו תשובה נכנסת לדו&quot;ח נעשית במסך העיבוד">${kic('split')}תשובה שונה אצל ${diff.map(r=>kRoleLbl(kind,r)).join(', ')} · בוחרים בעיבוד</span>`; } }
  return h; }

/* גוף לשונית בעל תפקיד: נושאים לפי ממד, ורק השאלות של בעל התפקיד */
function kRoleBody(kind,fid,role){
  const scope=kind==='gph'?'gph':fid; let h='';
  kRoleDims(kind,role).forEach(d=>{
    const tis=DATA[d].map((t,ti)=>ti).filter(ti=>DATA[d][ti].crits.some((c,ci)=>kHas(kind,role,d,ti,ci)));
    if(!tis.length) return;
    if(kind!=='gph'){ const n=tis.reduce((a,ti)=>a+DATA[d][ti].crits.filter((c,ci)=>kHas(kind,role,d,ti,ci)).length,0);
      h+=`<div class="k-dimh"><b>${DIM_META[d].label}</b><small>${n} שאלות</small></div>`; }
    K_FILTER=(ti,ci)=>kHas(kind,role,d,ti,ci); K_CC={kind,fid,role};
    h+=tis.map(ti=>renderTopic(d,DATA[d],ti,kRoleGetter(kind,fid,role,d),'pickR','naR',scope)).join('');
    K_FILTER=null; K_CC=null; });
  return h; }
function kRoleBtns(kind,fid,role){
  return kRolesOf(kind).map(r=>{ const p=kRoleProg(kind,fid,r); const full=p.tot&&p.pct===100;
    return `<button class="${r===role?'active':''} ${full?'done':''}" data-role="${r}" onclick="${kind==='gph'?'selGRole':'selRole'}('${r}')">
      ${kRoleLbl(kind,r)}<span class="mini">${p.done}/${p.tot}${full?' ✓':''}</span></button>`; }).join(''); }
function kRoleSummary(kind,fid,role){
  const tot=kind==='gph'?gphScore():fwScore(fid), tb=band(tot);
  return `<div class="fw-summary">
    <div class="fws-h">${svg(ICONS.dash,'style="width:15px;height:15px"')}${kind==='gph'?'ציוני בעלי התפקידים בגפ"ה':'ציוני בעלי התפקידים במסגרת זו'}<small class="k-fwsn">ציון בעל תפקיד לפי התשובות שלו · ציון ${kind==='gph'?'הגפ"ה':'המסגרת'} לפי התשובות הסופיות</small></div>
    <div class="fws-grid k-g${kRolesOf(kind).length+1}">
      ${kRolesOf(kind).map(r=>{ const val=kRoleScore(kind,fid,r), bb=band(val);
        return `<div class="fws-item ${r===role?'cur':''}" data-role="${r}"><span class="fws-lbl">${kRoleLbl(kind,r)}</span><span class="fws-val ${bb.k?'bg-'+bb.k:''}">${fmt(val)}</span></div>`; }).join('')}
      <div class="fws-item total"><span class="fws-lbl">${kind==='gph'?'ציון גפ"ה':'ציון מסגרת'}</span><span class="fws-val ${tb.k?'bg-'+tb.k:''}">${fmt(tot)}</span></div>
    </div></div>`; }
function kRoleLead(kind,role){
  const n=kRoleQCount(kind,role);
  return `שאלות לשיחה עם <b>${kRoleLbl(kind,role)}</b> · ${n} שאלות. שאלה שמסומנת "גם אצל" נשאלת גם בעלי תפקידים אחרים. אם התשובות שונות, בוחרים במסך העיבוד איזו תשובה נכנסת לציון ולדו"ח.`; }
/* רענון סרגל בעלי התפקידים והציונים בלי לרנדר את כל המסך */
function kRefreshRoleBar(dim){
  const kind=kKind(dim), fid=kind==='gph'?null:S.ui.activeFw;
  document.querySelectorAll('.k-rolebar button').forEach(btn=>{ const r=btn.dataset.role; const p=kRoleProg(kind,fid,r); const full=p.tot&&p.pct===100;
    const mini=btn.querySelector('.mini'); if(mini) mini.textContent=`${p.done}/${p.tot}${full?' ✓':''}`; btn.classList.toggle('done',!!full); });
  document.querySelectorAll('.fw-summary .fws-item').forEach(it=>{ const r=it.dataset.role;
    const val = r ? kRoleScore(kind,fid,r) : (kind==='gph'?gphScore():fwScore(fid));
    const sp=it.querySelector('.fws-val'); if(sp){ const bb=band(val); sp.className='fws-val '+(bb.k?'bg-'+bb.k:''); sp.textContent=fmt(val); } });
  if(kind==='fw') document.querySelectorAll('.fw-tab').forEach((b,i)=>{ const f=S.frameworks[i]; const pc=b.querySelector('.pct'); if(f&&pc) pc.textContent=kFwProg(f.id).pct+'%'; });
  const gp=document.getElementById('kgphprog'); if(gp&&kind==='gph'){ const p=kGphProg(); gp.innerHTML=kGphProgHTML(p); }
}

/* ============ מסך ביקורת מסגרות — לשוניות בעלי תפקידים ============ */
function viewFw(v){
  if(!S.ui.activeFw||!S.frameworks.find(f=>f.id===S.ui.activeFw)) S.ui.activeFw=S.frameworks[0].id;
  const fwId=S.ui.activeFw; const role=kCurRole('fw'); S.ui.role=role;

/* ============ תשובות סותרות — כרטיס במסך העיבוד ============ */
const CF_OPEN={};
function kConflicts(){
  const out=[];
  const scan=(kind,fid,dim)=>DATA[dim].forEach((t,ti)=>{ if(isTopicNA(kind==='gph'?'gph':fid,dim,ti)) return;
    t.crits.forEach((c,ci)=>{ const q=kQInfo(dim,ti,ci,fid); if(q.conflict) out.push({kind,fid,dim,ti,ci,q}); }); });
  if(S.gphEnabled) scan('gph',null,'gph');
  S.frameworks.forEach(f=>FW_DIMS.forEach(d=>scan('fw',f.id,d)));
  return out; }
function kPickAns(scope,dim,ti,ci,role){
  const kind=kKind(dim), fid=kind==='gph'?null:scope;

  if(st[k]===role) delete st[k]; else st[k]=role;
  save(); render();
  setTimeout(()=>{ const el=document.getElementById(`cf_${scope}_${dim}_${ti}_${ci}`); if(el) el.scrollIntoView({block:'nearest'}); },30); }
function kCellText(c,cell){
  if(!cell) return {t:'—',s:'—'};
  if(cell.opt!=null){ const o=critOpt(c,cell.opt); return {t:o?`${o.k} · ${o.t}`:cell.opt, s:o&&o.s!=null?o.s:'ללא ציון'}; }
  return {t:cell.nc?'לא נבדק':'לא רלוונטי', s:'—'}; }
function kConflictHTML(){

          <b>${kRoleLbl(x.kind,a.r)}</b><span class="cf-t">${esc(tx.t)}</span><i>${tx.s}</i><em>${on?kic('check')+'נבחרה לדו"ח':'בחירה'}</em></button>`; }).join('');
      return `<div class="cf-q ${x.q.pick?'done':''}" id="cf_${scope}_${x.dim}_${x.ti}_${x.ci}">
        <div class="cf-qh">${isG?'':`<span class="cf-dim">${DIM_META[x.dim].short}</span>`}<span class="cnum">${x.ti+1}.${x.ci+1}</span><span class="cf-qt">${esc(c.t)}</span>${x.q.pick?'':'<span class="cf-wait">ממתינה לבחירה</span>'}</div>
        <div class="cf-ans">${ans}</div></div>`; }).join('');
    return `<details class="uq-g cf-g" ${open?'open':''} ontoggle="CF_OPEN['${g.k}']=this.open"><summary>${kic('down','uq-car')}<b>${isG?'ניהול הדרכה חטיבתי גפ"ה':esc(f.label||'מסגרת')}</b>${mine?'<span class="k-own">שלך</span>':''}<span class="uq-dcs">${np?`<span class="uq-dc cf-p">${np} ממתינות</span>`:''}</span><span class="uq-n">${g.items.length}</span></summary><div class="cf-list">${rows}</div></details>`;

/* ============ דו"ח — סעיף 5 לפי בעלי תפקידים ============ */
function kRoleFindTable(kind,fid,role){
  const scope=kind==='gph'?'gph':fid; const dims=kRoleDims(kind,role); let rows='';
  dims.forEach(d=>{ let dRows='';
    DATA[d].forEach((t,ti)=>{
      if(!t.scored) return;
      const cis=t.crits.map((c,ci)=>ci).filter(ci=>kHas(kind,role,d,ti,ci)); if(!cis.length) return;
      const st=topicState(scope,d,ti);
      if(st){ dRows+=`<tr class="ftopic"><td><b>${ti+1}. ${esc(t.name)}</b></td><td class="c muted">${ST_LBL[st]}</td><td class="c">—</td></tr>`; return; }
      const g=kRoleGetter(kind,fid,role,d); const ts=topicScore(t,(ci)=>g(ti,ci));
      const sub=cis.map(ci=>{ const c=t.crits[ci]; if(c.w==null) return '';
        const cell=kRCell(kind,fid,role,d,ti,ci); if(!cell||cell.opt==null) return '';
        const o=critOpt(c,cell.opt); if(!o) return '';
        const q=kQInfo(d,ti,ci,fid); let mark='';
        if(q.conflict){ if(q.pick&&q.pick!==role) return ''; mark = q.pick===role ? ' <span class="r-pick" style="color:#2f6b3a;font-size:.9em">(נבחרה מתוך תשובות סותרות)</span>' : ' <span class="r-wait" style="color:#9a6a12;font-size:.9em">(תשובות סותרות — טרם נבחרה)</span>'; }
        return `<tr><td class="fsub">${ti+1}.${ci+1} ${esc(c.t)}</td><td>${esc(o.t)}${mark}</td><td class="c">${o.s==null?'—':o.s}</td></tr>`; }).join('');
      if(ts==null&&!sub) return;
      dRows+=`<tr class="ftopic"><td><b>${ti+1}. ${esc(t.name)}</b></td><td class="c">—</td><td class="c"><b>${ts==null?'—':Math.round(ts)}</b></td></tr>`+sub; });
    if(dRows) rows += (kind==='gph'?'':`<tr class="fdim"><td colspan="3" style="background:#f3f5f8;font-weight:bold;color:#1e3f68">${DIM_META[d].label}</td></tr>`) + dRows; });
  if(!rows) return '';
  const s=kRoleScore(kind,fid,role);
  return `<div class="subhead" style="font-size:13.5px;margin-top:13px">${kRoleLbl(kind,role)} ${s!=null?`<span class="pill bg-${band(s).k}">${Math.round(s)}</span>`:''}</div>
    <table class="rtable"><thead><tr><th style="width:34%">נושא / שאלה</th><th>התשובה</th><th style="width:9%" class="c">ציון</th></tr></thead><tbody>${rows}</tbody></table>`; }
function brigadeFindings(){
  if(!S.gphEnabled) return '';
  const parts=GPH_ROLES.map(r=>kRoleFindTable('gph',null,r)).join('');
  if(!parts) return '';
  const s=gphScore(); const who=kGphLabels(S);
  return `<div class="subhead" style="margin-top:20px;font-size:15px;border-top:1px solid var(--line);padding-top:14px">ניהול הדרכה חטיבתי גפ"ה <span class="pill bg-${band(s).k}">${fmt(s)}</span></div>
    ${who?`<p class="muted" style="font-size:12.5px;margin:2px 0 4px">נבדקה ע"י: ${esc(who)}</p>`:''}${parts}`; }
function frameworkFindings(f){

/* תוויות בריכוז השיפור/שימור ובהנחיות — שם המסגרת בלבד (בלי ממד) */
function scanFindings(){
  const out=[];
  DATA.gph.forEach((t,ti)=>{ if(!t.scored||isTopicNA('gph','gph',ti))return;
    const sc=topicScore(t,(ci)=>gphCell(ti,ci));
    const finds=topicCrits('gph',ti,gphCell).filter(c=>c.score!=null&&c.score<70).map(c=>c.optText);
    if(sc==null&&!finds.length)return;
    out.push({dim:'gph',name:t.name,scope:'ניהול הדרכה חטיבתי גפ"ה',score:sc,find:finds.join('; ')}); });
  S.frameworks.forEach(f=>FW_DIMS.forEach(dim=>DATA[dim].forEach((t,ti)=>{ if(!t.scored||isTopicNA(f.id,dim,ti))return;
    const sc=topicScore(t,(ci)=>fwCell(f.id,dim,ti,ci));
    const finds=topicCrits(dim,ti,(a,b)=>fwCell(f.id,dim,a,b)).filter(c=>c.score!=null&&c.score<70).map(c=>c.optText);
    if(sc==null&&!finds.length)return;
    out.push({dim,name:t.name,scope:(f.label||'מסגרת'),score:sc,find:finds.join('; ')}); })));
  return out; }
function scanKS(){
  const out=[];
  DATA.gph.forEach((t,ti)=>{ if(!t.scored||isTopicNA('gph','gph',ti))return;
    const sc=topicScore(t,(ci)=>gphCell(ti,ci)); if(sc==null)return; const cls=ksAuto(sc); if(!cls)return;
    out.push({scope:'gph',dim:'gph',ti,name:t.name,area:'ניהול הדרכה חטיבתי גפ"ה',score:sc,cls,crits:topicCrits('gph',ti,gphCell)}); });
  S.frameworks.forEach(f=>FW_DIMS.forEach(dim=>DATA[dim].forEach((t,ti)=>{ if(!t.scored||isTopicNA(f.id,dim,ti))return;
    const sc=topicScore(t,(ci)=>fwCell(f.id,dim,ti,ci)); if(sc==null)return; const cls=ksAuto(sc); if(!cls)return;
    out.push({scope:f.id,dim,ti,name:t.name,area:(f.label||'מסגרת'),score:sc,cls,crits:topicCrits(dim,ti,(a,b)=>fwCell(f.id,dim,a,b))}); })));
  return out; }

/* הערכה מסכמת — לפי בעלי תפקידים */
function genSummary(){
  const ov=overallScore(); if(ov==null) return '';
  const ob=band(ov), gs=gphScore(), nf=S.frameworks.length;
  const rs=FW_ROLES.map(r=>({r,s:kRoleAvg(r),label:kRoleLbl('fw',r)})).filter(x=>x.s!=null);
  rs.sort((a,b)=>b.s-a.s);
  const fwWord=nf===1?'מסגרת אחת שנבדקה':nf+' מסגרות שנבדקו';
  let t=`ביקורת ההדרכה${S.meta.unit?' ביחידת '+S.meta.unit:''} העלתה ציון מסכם משוקלל של ${Math.round(ov)}/100 (${ob.t}), על בסיס ${fwWord}`;
  if(gs!=null) t+=` וניהול הדרכה חטיבתי גפ"ה שעמד על ${Math.round(gs)}`;
  t+='. ';
  if(rs.length>=2){ const best=rs[0], worst=rs[rs.length-1];
    if(Math.round(best.s)-Math.round(worst.s)>=5)
      t+=`בשיחות עם בעלי התפקידים, התמונה הטובה ביותר עלתה אצל ${best.label} (${Math.round(best.s)}), והתמונה החלשה ביותר אצל ${worst.label} (${Math.round(worst.s)}). הפער מצביע על נושאים שנתפסים אחרת בדרגים השונים. `; }
  t+=({

/* ---- המרת תשובות מהגרסה הקודמת (לפי ממדים) לתשובות בעלי תפקידים ----
   תשובות המסגרת עוברות למ"פ (שנשאל את כל השאלות). תשובות הגפ"ה עוברות לבעל
   התפקיד שהשאלה שלו. המספור והאותיות מותאמים לשאלון המעודכן. */
const K_OLDOPT={ 'prog|0|2':{'ג':null,'ד':null,'ה':'ג'}, 'prog|0|3':{'ד':null},
  'prog|0|4':{'ג':null,'ד':'ג','ה':'ד','ו':'ה','ז':null}, 'prog|1|1':{'ב':null,'ג':'ב','ד':'ג'} };
function kConvOld(dim,ti,ci,cell){
  if(!kSig(cell)) return null;
  let nci=ci;
  if(dim==='prog'&&ti===0) nci=[0,2,3,4,5][ci];
  if(dim==='prog'&&ti===2&&ci===3) return null;
  if(nci==null) return null;
  const c=(DATA[dim][ti]||{crits:[]}).crits[nci]; if(!c) return null;
  const out={opt:null,score:null,naMark:!!cell.naMark,nc:!!cell.nc};
  if(cell.opt!=null){ const m=K_OLDOPT[dim+'|'+ti+'|'+nci]; let k=cell.opt;
    if(m&&Object.prototype.hasOwnProperty.call(m,k)) k=m[k];
    if(k==null) return null; const o=critOpt(c,k); if(!o) return null;
    out.opt=k; out.score=o.s; out.naMark=false; out.nc=false; }
  return [ti,nci,out]; }
function kMigrate(s){
  const pre={fw:{},gph:null};
  s.frameworks.forEach(f=>{ const fw=s.fw[f.id]; if(!fw||fw.pk._mig) return;
    if(!FW_DIMS.some(d=>Object.keys(fw[d]||{}).length)) return;
    pre.fw[f.id]={r:kclone(fw.r),pk:kclone(fw.pk)};
    FW_DIMS.forEach(d=>Object.entries(fw[d]||{}).forEach(([k,cell])=>{ const [ti,ci]=k.split('_').map(Number);
      const x=kConvOld(d,ti,ci,cell); if(!x) return; const rk='mp|'+d+'|'+x[0]+'_'+x[1]; if(!fw.r[rk]) fw.r[rk]=x[2]; }));
    fw.pk._mig=1; });
  if(!s.gphPk._mig && Object.keys(s.gph||{}).length){
    pre.gph={r:kclone(s.gphR),pk:kclone(s.gphPk)};
    Object.entries(s.gph).forEach(([k,cell])=>{ const [ti,ci]=k.split('_').map(Number); if(!kSig(cell)) return;
      const role=GPH_ROLES.find(r=>kHas('gph',r,'gph',ti,ci)); if(!role) return;
      const rk=role+'|'+k; if(!s.gphR[rk]) s.gphR[rk]={opt:cell.opt==null?null:cell.opt,score:cell.score==null?null:cell.score,naMark:!!cell.naMark,nc:!!cell.nc}; });
    s.gphPk._mig=1; }
  if(Object.keys(pre.fw).length||pre.gph) s._pre=pre; }

function kWsApply(){
  const ws=KA.ws; if(!ws.gotDoc || !ws.gotFw) return;
  if(!ws.doc){ if(ws.docCache) return; toast('הביקורת לא נמצאה — ייתכן שנמחקה'); kGo(KA.lastList||kDefaultView()); return; }
  if(KS.timer){ kFlush(); return; }
  const newS=kBuildS(ws.doc, ws.fws, (ws.ready&&S)?S.ui:null);
  if(ws.ready && kjson(kCore(newS))===kjson(kCore(S))){ S.inspectors=newS.inspectors; return; }
  S=newS; KS.base=kclone(kCore(S));

  kMigBase(); kWsHeadRefresh(); kSafeRender();

function kFlush(){
  clearTimeout(KS.timer); KS.timer=null;
  if(!KA.ws.id||!KS.base||!S) return;
  const id=KA.ws.id, base=KS.base, cur=kCore(S), store=KA.store, DEL=store.DEL();
  const main=[], fwP={}, denied=new Set(); let gphTouched=false; const touched=new Set();
  ['meta','frameworks','gphEnabled','gphInspector','gphInsps'].forEach(k=>{ if(kjson(cur[k])!==kjson(base[k])){ if(kIsAdmin()) main.push([[k],kclone(cur[k])]); else denied.add(k); } });
  ['gph','gphR','gphPk'].forEach(key=>kDiffMap(cur[key],base[key],(k,v)=>{ if(kCanScope('gph')){ main.push(...kCellPairs([key,k],v,(base[key]||{})[k])); gphTouched=true; } else denied.add('gph'); }));
  kDiffMap(cur.topicNA,base.topicNA,(k,v)=>{ const sc=k.split('|')[0]; if(kCanScope(sc)){ main.push([['topicNA',k], v?v:K_LDEL]); if(sc==='gph') gphTouched=true; else touched.add(sc); } else denied.add('na'); });
  kDiffMap(cur.report,base.report,(k,v)=>{ if(kRepKeyOK(k)) main.push([['report',k], v===undefined?K_LDEL:kclone(v)]); else denied.add('report'); });
  Object.keys(cur.fw||{}).forEach(fid=>{ K_FWKEYS.forEach(dim=>{
    kDiffMap((cur.fw[fid]||{})[dim], ((base.fw||{})[fid]||{})[dim], (k,v)=>{ if(kCanScope(fid)){ (fwP[fid]=fwP[fid]||[]).push(...kCellPairs([dim,k],v,(((base.fw||{})[fid]||{})[dim]||{})[k])); touched.add(fid); } else denied.add(fid); }); }); });
  const removed=Object.keys(base.fw||{}).filter(fid=>!(cur.fw||{})[fid]);
  if(gphTouched) main.push([['progress','gph'], kGphProg()]);
  touched.forEach(fid=>{ if(S.fw[fid]) main.push([['progress',fid], kFwProg(fid)]); });
  if(kIsAdmin()) removed.forEach(fid=>main.push([['progress',fid], K_LDEL]));
  if(main.length||Object.keys(fwP).length){ main.push([['updatedAt'],Date.now()]); main.push([['updatedBy'],kMe()]); }
  if(main.length) store.mergeInsp(id, kNest(main,DEL)).catch(()=>{});
  Object.entries(fwP).forEach(([fid,p])=>store.mergeFw(id,fid,kNest(p,DEL)).catch(()=>{}));
  if(kIsAdmin()) removed.forEach(fid=>store.delFw(id,fid).catch(()=>{}));
  if(denied.size){ S=kBuildS(KA.ws.doc, KA.ws.fws, S.ui); delete S._pre; kRO(); setTimeout(render,0); }
  KS.base=kclone(kCore(S));
  if(KA.insps[id]){ const d=KA.insps[id]; if(gphTouched||touched.size){ d.progress=d.progress||{}; if(gphTouched) d.progress.gph=kGphProg(); touched.forEach(fid=>{ if(S.fw[fid]) d.progress[fid]=kFwProg(fid); }); } }
}

/* =====================================================================
   דו"ח לכל מסגרת + הורדת Word (docx אמיתי) ו-PDF שעובדות גם בטלפון
   - לכל מסגרת (ולגפ"ה) דו"ח משלה, עם טקסטים שהבקר של המסגרת כותב
   - בקר רואה רק את הדו"חות של המסגרות שלו
   - מנהלות ומפקד/ת הביקורת רואים כל דו"ח בנפרד + דו"ח מסכם
   - הטקסטים נשמרים ב-report.fx_<מסגרת> ולא נכנסים לדו"ח המסכם
   ===================================================================== */
const FX_BLANK = () => ({summary:'', directives:['','',''], keep:'', improve:''});
function kSeeAll(){ if(kIsAdmin()) return true; const c=S&&S.meta&&S.meta.commander; return !!(c&&c.uid&&c.uid===kMe()); }
function kRepList(){
  if(!S) return [];
  const all=kSeeAll(), me=kMe(), out=[];
  if(all) out.push({id:'all', label:'דו"ח מסכם', sub:'כל המסגרות יחד', score:overallScore()});
  if(S.gphEnabled && (all || kGphHas(S,me))) out.push({id:'gph', label:'ניהול הדרכה חטיבתי גפ"ה', sub:kGphLabels(S)||'לא שובץ בקר', score:gphScore()});
  S.frameworks.forEach(f=>{ if(all || kFwHas(f,me)) out.push({id:f.id, label:f.label||'מסגרת', sub:kFwLabels(f)||'לא שובץ בקר', score:fwScore(f.id)}); });
  return out; }
function kRepCur(){ const L=kRepList(); if(!L.length) return null;
  S.ui=S.ui||{}; let id=S.ui.rep; if(!L.some(x=>x.id===id)) id=L[0].id; S.ui.rep=id; return L.find(x=>x.id===id); }
function fx(scope){ const k='fx_'+scope; const v=S.report[k];
  return Object.assign(FX_BLANK(), v||{}, {directives:Array.isArray(v&&v.directives)?v.directives.slice():['','','']}); }
function fxPut(scope,obj){ S.report['fx_'+scope]=obj; save(); fxRefreshPaper(); }
function fxSet(scope,key,val){ const o=fx(scope); o[key]=val; fxPut(scope,o); }
function fxDirUpd(scope,i,val){ const o=fx(scope); o.directives[i]=val; fxPut(scope,o); }
function fxDirAdd(scope){ const o=fx(scope); o.directives.push(''); fxPut(scope,o); render(); }
function fxDirDel(scope,i){ const o=fx(scope); o.directives.splice(i,1); fxPut(scope,o); render(); }
let _fxT=null;
function fxRefreshPaper(){ clearTimeout(_fxT); _fxT=setTimeout(()=>{ const p=document.getElementById('paper'); const r=kRepCur(); if(p&&r) p.innerHTML=kRepHTML(r.id); },250); }

/* ---- טיוטות לדו"ח מסגרת ---- */
function fxGenSummary(scope){
  if(scope==='gph'){ const s=gphScore(); if(s==null) return '';
    const b=band(s); const rs=GPH_ROLES.map(r=>({l:kRoleLbl('gph',r),s:kRoleScore('gph',null,r)})).filter(x=>x.s!=null).sort((a,b)=>b.s-a.s);
    let t=`ניהול ההדרכה החטיבתי (גפ"ה)${S.meta.unit?' ביחידת '+S.meta.unit:''} קיבל ציון ${Math.round(s)}/100 (${b.t}). `;
    if(rs.length>=2&&Math.round(rs[0].s)-Math.round(rs[rs.length-1].s)>=5) t+=`בשיחות עם בעלי התפקידים, התמונה הטובה ביותר עלתה אצל ${rs[0].l} (${Math.round(rs[0].s)}) והחלשה ביותר אצל ${rs[rs.length-1].l} (${Math.round(rs[rs.length-1].s)}). `;
    return t+fxBandLine(b.k); }
  const f=S.frameworks.find(x=>x.id===scope); if(!f) return ''; const s=fwScore(f.id); if(s==null) return '';
  const b=band(s); const rs=FW_ROLES.map(r=>({l:kRoleLbl('fw',r),s:kRoleScore('fw',f.id,r)})).filter(x=>x.s!=null).sort((a,b)=>b.s-a.s);
  let t=`מסגרת ${f.label||''}${f.kind?' ('+f.kind+')':''} קיבלה ציון ${Math.round(s)}/100 (${b.t}). `;
  if(rs.length>=2&&Math.round(rs[0].s)-Math.round(rs[rs.length-1].s)>=5) t+=`בשיחות עם בעלי התפקידים, התמונה הטובה ביותר עלתה אצל ${rs[0].l} (${Math.round(rs[0].s)}) והחלשה ביותר אצל ${rs[rs.length-1].l} (${Math.round(rs[rs.length-1].s)}). הפער מצביע על נושאים שנתפסים אחרת בדרגים השונים. `;
  return t+fxBandLine(b.k); }
function fxBandLine(k){ return ({good:'תמונת המצב טובה ומשקפת עמידה רחבה בנהלי תקן "יסודות מנצחים"; הדגש הוא על שימור ההישגים והשלמת פערים נקודתיים.',
  mid:'תמונת המצב סבירה ומשקפת עמידה חלקית בתקן; נדרש מאמץ ממוקד לסגירת הפערים שזוהו.',
  low:'תמונת המצב מצביעה על פערים מהותיים מול נהלי התקן, הדורשים תכנית התערבות מסודרת בליווי הדרג הממונה.'})[k]||''; }
function fxGenDirectives(scope){
  const name = scope==='gph' ? 'ניהול הדרכה חטיבתי גפ"ה' : ((S.frameworks.find(x=>x.id===scope)||{}).label||'מסגרת');
  const items=scanFindings().filter(x=>x.scope===name && x.score!=null && x.score<=69).sort((a,b)=>a.score-b.score);
  return items.map(x=>{ const kb=kbOf(x.dim,x.name); const tag=x.score<60?'טיפול מיידי':'לטיפול';
    return `[${tag}] ${x.name} (ציון ${Math.round(x.score)}):${x.find?' נמצא: '+x.find+'.':''} נדרש ${kb.fix}${kb.ref?` (נוהל ${kb.ref})`:''}.`; }); }
function fxGen(scope,which){
  const o=fx(scope);
  if(which==='summary'){ const v=fxGenSummary(scope); if(!v){ toast('יש לבחור תשובות במסגרת לפני הניסוח'); return; }
    if(!confirmRepl(o.summary)) return; o.summary=v; }
  else if(which==='directives'){ const l=fxGenDirectives(scope); if(!l.length){ toast('לא זוהו במסגרת נושאים בציון נמוך הדורשים טיפול'); return; }
    if(o.directives.some(d=>d.trim())&&!confirm('קיימות הנחיות שהוזנו. להחליפן בטיוטה?')) return; o.directives=l; }
  fxPut(scope,o); render(); toast('נוסחה טיוטה — ניתנת לעריכה חופשית'); }

/* ---- בניית הדו"ח של מסגרת אחת ---- */
function ksReportFor(scope){
  const all=scanKS().filter(x=>x.scope===scope);
  const srt=cls=>all.filter(x=>x.cls===cls).sort((a,b)=>a.score-b.score||a.name.localeCompare(b.name,'he'));
  const imp=srt('improve'), keep=srt('keep');
  if(!imp.length&&!keep.length) return '<p class="ks-empty">טרם נבחרו תשובות — ריכוז השיפור/שימור ייבנה אוטומטית עם בחירת התשובות.</p>';
  return `<div class="ks-report">${ksColHTML('improve',imp)}${ksColHTML('keep',keep)}</div>`; }
function kRepHTML(id){ return id==='all' ? reportHTML() : fwReportHTML(id); }
function fwReportHTML(scope){
  const m=S.meta, c=m.commander||{}, isG=scope==='gph';
  const f=isG?null:S.frameworks.find(x=>x.id===scope); if(!isG&&!f) return '';
  const name=isG?'ניהול הדרכה חטיבתי גפ"ה':(f.label||'מסגרת');
  const s=isG?gphScore():fwScore(f.id), b=band(s);

    const h=new DataView(new ArrayBuffer(30)); h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);

    parts.push(new Uint8Array(h.buffer),nm,data);
    const c=new DataView(new ArrayBuffer(46)); c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true);
    c.setUint16(12,dt,true); c.setUint16(14,dd,true); c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,nm.length,true);

function kBlocks(el,acc){

    if(cl.contains('doc-title')){ const h=n.querySelector('h1'), s=n.querySelector('.sub');
      if(h) acc.push(kPara(kInline(h,{b:true,sz:34}),{jc:'center',after:60}));
      if(s) acc.push(kPara(kInline(s,{sz:21,color:'444444'}),{jc:'center',after:280})); return; }
    if(cl.contains('rsec-h')){ const num=(n.querySelector('.n')||{}).textContent||'', h=n.querySelector('h3');

    if(cl.contains('subhead')){ acc.push(kPara(kInline(n,{b:true,sz:23,color:'1E3F68'}),{before:180,after:60,keep:true})); return; }
    if(cl.contains('find-topic')){ acc.push(kPara(kInline(n,{b:true,sz:22,color:'1E3F68'}),{before:120,after:40,keep:true,border:4,bcolor:'CFD9E6'})); return; }
    if(tg==='H4'){ acc.push(kPara(kInline(n,{b:true,sz:24,color:'1E3F68'}),{before:160,after:80,keep:true,border:8})); return; }
    if(cl.contains('ks-entry')){ const kh=n.querySelector('.kh'); if(kh) acc.push(kPara(kInline(kh,{sz:22}),{before:80,after:30,keep:true,border:4,bcolor:'BBBBBB'}));
      n.querySelectorAll('.ks-crit').forEach(c=>acc.push(kPara(kInline(c,{sz:20}),{after:30,ind:240}))); return; }
    if(tg==='UL'||tg==='OL'){ [...n.children].forEach((li,i)=>acc.push(kPara(kRun(tg==='OL'?(i+1)+'. ':'•  ',{sz:22})+kInline(li),{ind:360,hang:240,after:40}))); return; }

/* =================== PDF: צילום הדו"ח לעמודי A4 =================== */
let _kH2C=null;
function kLoadH2C(){ if(window.html2canvas) return Promise.resolve(); if(_kH2C) return _kH2C;
  const srcs=['https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js','https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js','https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js'];
  _kH2C=new Promise((res,rej)=>{ let i=0; const next=()=>{ if(i>=srcs.length){ _kH2C=null; rej(new Error('load')); return; }
    const s=document.createElement('script'); s.src=srcs[i++]; s.onload=()=>window.html2canvas?res():next(); s.onerror=()=>{ s.remove(); next(); }; document.head.appendChild(s); }; next(); });
  return _kH2C; }
function kB64(u8){ let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return s; }
function kJpegBytes(canvas){ const d=canvas.toDataURL('image/jpeg',0.9); const b=atob(d.split(',')[1]); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
function kPdf(pages){ // pages: [{jpg:Uint8Array, w, h (px), dw, dh (pt), x, y}]
  const enc=new TextEncoder(), chunks=[], offs=[]; let len=0;
  const push=x=>{ const u=typeof x==='string'?enc.encode(x):x; chunks.push(u); len+=u.length; };
  const obj=(n,body)=>{ offs[n]=len; push(`${n} 0 obj\n`); body.forEach(push); push('\nendobj\n'); };
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'.replace(/[\u0080-ÿ]/g,'')+'\n');
  const N=pages.length, kids=[]; for(let i=0;i<N;i++) kids.push(`${3+i*3} 0 R`);
  obj(1,['<< /Type /Catalog /Pages 2 0 R >>']);
  obj(2,[`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${N} >>`]);
  pages.forEach((p,i)=>{ const pn=3+i*3, cn=pn+1, im=pn+2;
    const cs=`q ${p.dw.toFixed(2)} 0 0 ${p.dh.toFixed(2)} ${p.x.toFixed(2)} ${p.y.toFixed(2)} cm /Im0 Do Q`;
    obj(pn,[`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${cn} 0 R >>`]);
    obj(cn,[`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`]);
    obj(im,[`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpg.length} >>\nstream\n`,p.jpg,'\nendstream']); });

  return new Blob(chunks,{type:'application/pdf'}); }
let _kPdfBusy=false;
async function kDlPdf(){
  const cur=kRepCur(); if(!cur||_kPdfBusy) return; _kPdfBusy=true;
  const btns=[...document.querySelectorAll('.report-toolbar .btn')]; btns.forEach(b=>b.disabled=true);
  toast('מכין PDF…');
  let host=null;
  try{
    await kLoadH2C(); if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    const PX=760; // רוחב תוכן העמוד בפיקסלים
    host=document.createElement('div'); host.className='kpdf-host';
    host.innerHTML=`<div class="paper kpdf-paper" style="width:${PX}px">${kRepHTML(cur.id)}</div>`;
    document.body.appendChild(host);
    const el=host.firstChild; await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const H=el.scrollHeight, top0=el.getBoundingClientRect().top;
    // נקודות שבירה בטוחות: לא חותכים שורה, פסקה או כותרת
    const atoms=[...el.querySelectorAll('tr,p,li,.kv,.subhead,.rsec-h,.ks-crit,.kh,.find-topic,.doc-title,.doc-class,h4,.find-line')].map(n=>{ const r=n.getBoundingClientRect(); return [r.top-top0, r.bottom-top0]; });
    const heads=[...el.querySelectorAll('.rsec-h,.subhead,.find-topic,h4,thead tr')].map(n=>{ const r=n.getBoundingClientRect(); return [r.top-top0, r.bottom-top0]; });
    const ok=y=>!atoms.some(([a,b])=>a<y-1&&b>y+1) && !heads.some(([a,b])=>b<=y+1&&b>y-26);
    const M=34, PW=595.28, PH=841.89, CW=PW-2*M, CH=PH-2*M; const pagePx=Math.floor(PX*CH/CW);
    const breaks=[0]; let y=0;
    while(y+pagePx<H){ let b=y+pagePx, lim=y+pagePx*0.55; while(b>lim&&!ok(b)) b-=2; if(b<=lim) b=y+pagePx; breaks.push(b); y=b; }
    breaks.push(H);
    const scale=Math.min(2, (window.devicePixelRatio||1)>1?2:2);
    const canvas=await window.html2canvas(el,{scale, backgroundColor:'#ffffff', useCORS:true, logging:false, width:PX, height:H, windowWidth:PX+80});
    const k=canvas.width/PX, pages=[];
    for(let i=0;i<breaks.length-1;i++){ const sy=Math.round(breaks[i]*k), sh=Math.max(1,Math.round((breaks[i+1]-breaks[i])*k));
      const c=document.createElement('canvas'); c.width=canvas.width; c.height=sh; const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,sh); g.drawImage(canvas,0,sy,canvas.width,sh,0,0,canvas.width,sh);
      const dh=CW*sh/canvas.width; pages.push({jpg:kJpegBytes(c), w:c.width, h:sh, dw:CW, dh, x:M, y:PH-M-dh}); }
    kDeliver(kPdf(pages), kRepFileBase()+'.pdf');
  }catch(e){ console.error(e); toast('לא הצלחנו ליצור PDF — נפתח חלון הדפסה במקום'); setTimeout(()=>window.print(),600); }
  finally{ if(host) host.remove(); btns.forEach(b=>b.disabled=false); _kPdfBusy=false; } }
