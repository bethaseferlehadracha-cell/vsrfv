picNA:{},\n  report:{directives:['','',''],summary:'',trendsKeep:'',trendsImprove:'',recommendations:'',crossCut:'',brigadeMethod:'',brigadeGeneral:''},\n  ui:{activeFw:null, dim:'prog'}\n});\nlet S = BLANK();\nlet nav = 'home';\n\n/* ---------- persistence ---------- */\nconst LS='idf_insp_v1';\nfunction save(){ try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){} }\nfunction load(){ try{const r=localStorage.getItem(LS); if(r){S=Object.assign(BLANK(),JSON.parse(r)); S.ui=S.ui||{dim:'prog',activeFw:null}; S.topicNA=S.topicNA||{}; delete S.ks; delete S.pinned; S.report=Object.assign({directives:['','',''],summary:'',trendsKeep:'',trendsImprove:'',recommendations:'',crossCut:'',brigadeMethod:'',brigadeGeneral:''},S.report||{});}}catch(e){} }\nfunction uid(){ return Math.random().toString(36).slice(2,9); }\n\n/* ---------- scoring engine ---------- */\nfunction band(v){\n  if(v==null) return {t:'—',c:'',k:''};\n  if(v>=90) return {t:'מצוין',c:'sc-good',k:'good'};\n  if(v>=80) return {t:'טוב מאוד',c:'sc-good',k:'good'};\n  if(v>=70) return {t:'טוב',c:'sc-mid',k:'mid'};\n  if(v>=60) return {t:'מספק',c:'sc-mid',k:'mid'};\n  return {t:'דורש שיפור',c:'sc-low',k:'low'};\n}\nfunction vclass(v){ if(v==null)return''; return v>=80?'v-good':v>=65?'v-mid':'v-low'; }\nfunction cellKey(ti,ci){ return ti+'_'+ci; }\nfunction gphCell(ti,ci){ return S.gph[cellKey(ti,ci)]||null; }\nfunction fwCell(fwId,dim,ti,ci){ return (S.fw[fwId]&&S.fw[fwId][dim]&&S.fw[fwId][dim][cellKey(ti,ci)])||null; }\nfunction setGph(ti,ci,patch){ const k=cellKey(ti,ci); S.gph[k]=Object.assign({score:null,opt:null},S.gph[k],patch); save(); }\nfunction setFw(fwId,dim,ti,ci,patch){ S.fw[fwId]=S.fw[fwId]||{}; S.fw[fwId][dim]=S.fw[fwId][dim]||{}; const k=cellKey(ti,ci);\n  S.fw[fwId][dim][k]=Object.assign({score:null,opt:null},S.fw[fwId][dim][k],patch); save(); }\n\nfunction topicScore(topic, getter){\n  let ws=0,acc=0,any=false;\n  topic.crits.forEach((c,ci)=>{\n    if(c.w==null) return;\n    const cell=getter(ci);\n    if(!cell||cell.score==null) return;\n    ws+=c.w; acc+=c.w*cell.score; any=true;\n  });\n  return (any&&ws>0)?acc/ws:null;\n}\nfunction dimScore(scope, dim, topics, topicGetter){\n  let ws=0,acc=0,any=false;\n  topics.forEach((t,ti)=>{\n    if(!t.scored||!t.w||isTopicNA(scope,dim,ti)) return;\n    const ts=topicScore(t,(ci)=>topicGetter(ti,ci));\n    if(ts==null) return;\n    ws+=t.w; acc+=t.w*ts; any=true;\n  });\n  return (any&&ws>0)?acc/ws:null;\n}\nconst gphScore = ()=> dimScore('gph','gph',DATA.gph,(ti,ci)=>gphCell(ti,ci));\nconst fwDimScore = (fwId,dim)=> dimScore(fwId,dim,DATA[dim],(ti,ci)=>fwCell(fwId,dim,ti,ci));\nfunction fwScore(fwId){\n  const vals=['prog','cmd','trainee'].map(d=>fwDimScore(fwId,d)).filter(v=>v!=null);\n  return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;\n}\nfunction dimAvgAcrossFw(dim){\n  const vals=S.frameworks.map(f=>fwDimScore(f.id,dim)).filter(v=>v!=null);\n  return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;\n}\nfunction overallScore(){\n  const parts=[gphScore(),dimAvgAcrossFw('prog'),dimAvgAcrossFw('cmd'),dimAvgAcrossFw('trainee')].filter(v=>v!=null);\n  return parts.length? parts.reduce((a,b)=>a+b,0)/parts.length : null;\n}\n\n/* ---------- סיווג שימור / שיפור ----------\n   הסיווג נגזר אך ורק מהציון הסופי של הנושא / הקריטריון, ללא כל סימון ידני:\n     ציון <  70  =>  שיפור\n     ציון >= 70  =>  שימור\n   נושא ללא ציון (טרם דורג / N/A / סעיף שאינו מחושב בציון) אינו מסווג כלל\n   ומוחזר null — ולכן אינו נכנס לרשימות השיפור/שימור בדו\"ח. */\nconst KS_THRESHOLD = 70;\nfunction ksKey(scope,dim,ti){ return scope+'|'+dim+'|'+ti; }\nfunction ksLabel(cls){ return cls==='keep' ? 'שימור' : cls==='improve' ? 'שיפור' : ''; }\nfunction ksAuto(score){\n  if(score==null || typeof score!=='number' || !isFinite(score)) return null;\n  return score>=KS_THRESHOLD ? 'keep' : 'improve';\n}\n/* ---------- נושא כ\"לא רלוונטי / לא נבדק\" — יוצא לגמרי מחישוב הציון ---------- */\nfunction isTopicNA(scope,dim,ti){ return !!S.topicNA[ksKey(scope,dim,ti)]; }\nfunction toggleTopicNA(scope,dim,ti){ const k=ksKey(scope,dim,ti); if(S.topicNA[k])delete S.topicNA[k]; else S.topicNA[k]=true; save(); render(); }\n/* ממוצע ציוני כלל הנושאים בקטגוריה (ממד) בהינתן getter לתא, וסיווגה */\nfunction dimTopicAvg(scope, dim, getter){\n  const topics=DATA[dim]||[];\n  const vals=topics.map((t,ti)=> (t.scored&&!isTopicNA(scope,dim,ti))?topicScore(t,(ci)=>getter(ti,ci)):null).filter(v=>v!=null);\n  return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;\n}\n\n\n/* progress */\nfunction dimProgress(getter, topics){\n  let done=0,tot=0;\n  topics.forEach((t,ti)=> t.crits.forEach((c,ci)=>{ if(c.w==null)return; tot++; const cell=getter(ti,ci); if(cell&&cell.score!=null)done++; }));\n  return {done,tot,pct:tot?Math.round(done/tot*100):0};\n}\nfunction fwProgress(fwId){\n  let done=0,tot=0;\n  FW_DIMS.forEach(dim=>{ const p=dimProgress((ti,ci)=>fwCell(fwId,dim,ti,ci),DATA[dim]); done+=p.done; tot+=p.tot; });\n  return {done,tot,pct:tot?Math.round(done/tot*100):0};\n}\n\n/* ---------- helpers ---------- */\nfunction svg(p,extra=''){ return `<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" ${extra}>${p}<\u002Fsvg>`; }\nfunction esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;'); }\nfunction fmt(v){ return v==null?'—':Math.round(v); }\nfunction toast(msg){ const t=document.getElementById('toast'); t.innerHTML=svg(ICONS.check)+esc(msg); t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }\nfunction ranges(){ const m=S.meta; if(m.dateFrom&&m.dateTo) return `${m.dateFrom} – ${m.dateTo}`; return m.dateFrom||m.dateTo||''; }\n\n/* ============ NAV ============ */\nfunction renderNav(){\n  const ready = S.frameworks.length>0;\n  const items=[\n    {k:'home',label:'בית והקמת ביקורת',icon:ICONS.home},\n    {k:'brigade',label:'ביקורת רמת חטיבה',icon:ICONS.brigade,badge:band(gphScore()).t!=='—'?fmt(gphScore()):''},\n    {k:'fw',label:'ביקורת מסגרות',icon:ICONS.framework,badge:ready?S.frameworks.length:'',lock:!ready},\n    {k:'dash',label:'עיבוד למפקד הביקורת',icon:ICONS.dash,lock:!ready},\n    {k:'report',label:'מחולל הדוחות',icon:ICONS.report,lock:!ready},\n  ];\n  document.getElementById('nav').innerHTML = items.map(it=>{\n    const cls = 'nav-item'+(nav===it.k?' active':'')+(it.lock?' lock':'');\n    const badge = it.badge?`<span class=\"badge\">${it.badge}<\u002Fspan>`:'';\n    return `<button class=\"${cls}\" onclick=\"${it.lock?'':`go('${it.k}')`}\">${svg(it.icon)}<span>${it.label}<\u002Fspan>${badge}<\u002Fbutton>`;\n  }).join('');\n}\nfunction go(k){ nav=k; render(); window.scrollTo(0,0); }\n\n/* ============ RENDER ROUTER ============ */\nconst TITLES={home:['הקמת ביקורת','הגדרת מסגרת הביקורת, צוות הבקרים והמסגרות הנבדקות'],\n  brigade:['ביקורת רמת חטיבה — גפ\"ה','בחינת קיום נהלי הדרכה ברמת היחידה / מד\"ריה / גפ\"ה'],\n  fw:['ביקורת מסגרת','איסוף נתונים בשטח לפי שלושת ממדי ההדרכה'],\n  dash:['עיבוד נתונים — מפקד הביקורת','תמונה מתכללת, זיהוי מגמות חוזרות וניסוח התייחסות רוחבית'],\n  report:['מחולל דו\"ח הסיכום','הפקה אוטומטית של דו\"ח מובנה ושמירתו כ-PDF']};\nfunction render(){\n  renderNav();\n  const t=TITLES[nav]; document.getElementById('ptitle').textContent=t[0]; document.getElementById('crumb').textContent=t[1];\n  document.getElementById('ctx').innerHTML = S.meta.unit?`<span class=\"chip\">${svg(ICONS.brigade)}${esc(S.meta.unit)}<\u002Fspan>`+(ranges()?`<span class=\"chip\">${ranges()}<\u002Fspan>`:''):'';\n  const v=document.getElementById('view');\n  ({home:viewHome,brigade:viewBrigade,fw:viewFw,dash:viewDash,report:viewReport})[nav](v);\n}\n\n/* ============ HOME / SETUP ============ */\nfunction viewHome(v){\n  const m=S.meta;\n  v.innerHTML=`\n  <div class=\"card subcard\">\n    <div class=\"section-h\"><span class=\"num\">א<\u002Fspan><h3>כללי<\u002Fh3><\u002Fdiv>\n    <div class=\"grid2\" style=\"margin-bottom:15px\">\n      <div><label class=\"f\">שם היחידה הנסקרת<\u002Flabel><input class=\"inp\" value=\"${esc(m.unit)}\" oninput=\"setMeta('unit',this.value)\" placeholder=\"לדוגמה: חטיבת X / בה&quot;ד Y\"><\u002Fdiv>\n      <div><label class=\"f\">שם הביקורת<\u002Flabel><input class=\"inp\" value=\"${esc(m.name)}\" oninput=\"setMeta('name',this.value)\" placeholder=\"ביקורת הדרכה תקופתית\"><\u002Fdiv>\n      <div><label class=\"f\">תאריך התחלה<\u002Flabel><input class=\"inp\" value=\"${esc(m.dateFrom)}\" oninput=\"setMeta('dateFrom',this.value)\" placeholder=\"טט/חח/שש\"><\u002Fdiv>\n      <div><label class=\"f\">תאריך סיום<\u002Flabel><input class=\"inp\" value=\"${esc(m.dateTo)}\" oninput=\"setMeta('dateTo',this.value)\" placeholder=\"טט/חח/שש\"><\u002Fdiv>\n      <div><label class=\"f\">סוג הביקורת<\u002Flabel>\n        <select class=\"inp\" onchange=\"setMeta('type',this.value)\">\n          ${['אינטגרטיבית','מכינה לסיקור מטכ\"לי','ביקורת תקופתית','ביקורת פתע'].map(o=>`<option ${m.type===o?'selected':''}>${o}<\u002Foption>`).join('')}\n        <\u002Fselect><\u002Fdiv>\n      <div><label class=\"f\">הקשר / שיוך (אופציונלי)<\u002Flabel><input class=\"inp\" value=\"${esc(m.integrative)}\" oninput=\"setMeta('integrative',this.value)\" placeholder=\"כחלק מביקורת חטיבת ההפעלה / הכנה לסיקור\"><\u002Fdiv>\n    <\u002Fdiv>\n    <label class=\"f\">מפקד הביקורת<\u002Flabel>\n    <div class=\"grid3\">\n      <input class=\"inp\" value=\"${esc(m.commander.name)}\" oninput=\"setCmd('name',this.value)\" placeholder=\"שם מלא\">\n      <input class=\"inp\" value=\"${esc(m.commander.rank)}\" oninput=\"setCmd('rank',this.value)\" placeholder=\"דרגה\">\n      <input class=\"inp\" value=\"${esc(m.commander.role)}\" oninput=\"setCmd('role',this.value)\" placeholder=\"תפקיד\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"card subcard\">\n    <div class=\"section-h\"><span class=\"num\">ב<\u002Fspan><h3>צוות הבקרים<\u002Fh3><p>${S.inspectors.length} בקרים<\u002Fp><\u002Fdiv>\n    <div id=\"insp-list\">${S.inspectors.map(renderInsp).join('')||'<p class=\"muted\" style=\"font-size:13.5px;margin-bottom:12px\">לא הוגדרו בקרים עדיין.<\u002Fp>'}<\u002Fdiv>\n    <button class=\"btn btn-ghost btn-sm\" onclick=\"addInsp()\">${svg('<path d=\"M12 5v14M5 12h14\"/>')}הוספת בקר<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div class=\"card subcard\">\n    <div class=\"section-h\"><span class=\"num\">ג<\u002Fspan><h3>המסגרות הנבדקות<\u002Fh3><p>${S.frameworks.length} מסגרות<\u002Fp><\u002Fdiv>\n    <div id=\"fw-list\">${S.frameworks.map(renderFwRow).join('')||'<p class=\"muted\" style=\"font-size:13.5px;margin-bottom:12px\">יש להגדיר לפחות מסגרת אחת (גדוד / ענף) כדי להתחיל בביקורת.<\u002Fp>'}<\u002Fdiv>\n    <button class=\"btn btn-ghost btn-sm\" onclick=\"addFw()\">${svg('<path d=\"M12 5v14M5 12h14\"/>')}הוספת מסגרת<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div class=\"card subcard\">\n    <div class=\"section-h\"><span class=\"num\">ד<\u002Fspan><h3>שיטת הביקורת<\u002Fh3><\u002Fdiv>\n    <label class=\"f\">ברמת החטיבה<\u002Flabel>\n    <textarea class=\"inp\" oninput=\"setMeta('methodBrigade',this.value)\" placeholder=\"בחינת קיום נהלי הדרכה המתבצעים לכלל הגדודים והענפים, בהובלת המד&quot;ריה / גפ&quot;ה ומפקד החטיבה\">${esc(m.methodBrigade)}<\u002Ftextarea>\n    <label class=\"f\" style=\"margin-top:13px\">ברמת המסגרת<\u002Flabel>\n    <textarea class=\"inp\" oninput=\"setMeta('methodFramework',this.value)\" placeholder=\"בחינת המסגרת על-פי שלושת ממדי ההדרכה: תכנית הכשרה, סגל וחניכים\">${esc(m.methodFramework)}<\u002Ftextarea>\n  <\u002Fdiv>\n\n  <div class=\"flow-foot\">\n    <div class=\"spacer\"><\u002Fdiv>\n    <button class=\"btn btn-primary\" onclick=\"${S.frameworks.length?`go('fw')`:`toast('יש להגדיר מסגרת אחת לפחות')`}\" ${S.frameworks.length?'':'disabled'}>\n      מעבר לאיסוף נתונים${svg('<path d=\"M19 12H5M12 19l-7-7 7-7\"/>')}<\u002Fbutton>\n  <\u002Fdiv>`;\n}\nfunction renderInsp(p,i){ return `<div class=\"repeater-row insp\">\n  <div><label class=\"f\">שם מלא<\u002Flabel><input class=\"inp\" value=\"${esc(p.name)}\" oninput=\"updInsp(${i},'name',this.value)\"><\u002Fdiv>\n  <div><label class=\"f\">דרגה<\u002Flabel><input class=\"inp\" value=\"${esc(p.rank)}\" oninput=\"updInsp(${i},'rank',this.value)\"><\u002Fdiv>\n  <div><label class=\"f\">תפקיד<\u002Flabel><input class=\"inp\" value=\"${esc(p.role)}\" oninput=\"updInsp(${i},'role',this.value)\"><\u002Fdiv>\n  <button class=\"icon-btn\" onclick=\"delInsp(${i})\" title=\"מחיקה\">${svg('<path d=\"M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m-9 0v14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V6\"/>')}<\u002Fbutton>\n<\u002Fdiv>`; }\nfunction renderFwRow(f,i){ const insp=S.inspectors;\n  return `<div class=\"repeater-row fw\">\n  <div><label class=\"f\">שם המסגרת<\u002Flabel><input class=\"inp\" value=\"${esc(f.label)}\" oninput=\"updFw(${i},'label',this.value)\" placeholder=\"גדוד 1 / ענף הדרכה\"><\u002Fdiv>\n  <div><label class=\"f\">סוג<\u002Flabel><select class=\"inp\" onchange=\"updFw(${i},'kind',this.value)\">\n    ${['גדוד','ענף','פלוגה','מחלקה','אחר'].map(o=>`<option ${f.kind===o?'selected':''}>${o}<\u002Foption>`).join('')}<\u002Fselect><\u002Fdiv>\n  <div><label class=\"f\">בקר אחראי<\u002Flabel><select class=\"inp\" onchange=\"updFw(${i},'inspectorId',this.value)\">\n    <option value=\"\">— ללא —<\u002Foption>\n    ${insp.map(p=>`<option value=\"${p.id}\" ${f.inspectorId===p.id?'selected':''}>${esc(p.name||'בקר ללא שם')}${p.rank?' ('+esc(p.rank)+')':''}<\u002Foption>`).join('')}<\u002Fselect><\u002Fdiv>\n  <button class=\"icon-btn\" onclick=\"delFw(${i})\" title=\"מחיקה\">${svg('<path d=\"M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m-9 0v14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V6\"/>')}<\u002Fbutton>\n<\u002Fdiv>`; }\nfunction setMeta(k,val){ S.meta[k]=val; save(); if(k==='unit'||k==='dateFrom'||k==='dateTo'){document.getElementById('ctx').innerHTML=S.meta.unit?`<span class=\"chip\">${svg(ICONS.brigade)}${esc(S.meta.unit)}<\u002Fspan>`+(ranges()?`<span class=\"chip\">${ranges()}<\u002Fspan>`:''):'';} }\nfunction setCmd(k,val){ S.meta.commander[k]=val; save(); }\nfunction addInsp(){ S.inspectors.push({id:uid(),name:'',rank:'',role:''}); save(); render(); }\nfunction updInsp(i,k,v){ S.inspectors[i][k]=v; save(); }\nfunction delInsp(i){ const id=S.inspectors[i].id; S.frameworks.forEach(f=>{if(f.inspectorId===id)f.inspectorId='';}); S.inspectors.splice(i,1); save(); render(); }\nfunction addFw(){ S.frameworks.push({id:uid(),label:'',kind:'גדוד',inspectorId:''}); save(); render(); renderNav(); }\nfunction updFw(i,k,v){ S.frameworks[i][k]=v; save(); if(k==='label')renderNav(); }\nfunction delFw(i){ const id=S.frameworks[i].id; delete S.fw[id]; if(S.ui.activeFw===id)S.ui.activeFw=null; S.frameworks.splice(i,1); save(); render(); }\n\n/* ============ CRITERIA RENDERER (shared) ============ */\nfunction renderTopic(dimKey,topics,ti,getter,onScore,onNA,scope){\n  const t=topics[ti];\n  const na=isTopicNA(scope,dimKey,ti);\n  let done=0,tot=0;\n  t.crits.forEach((c,ci)=>{ if(c.w==null)return; tot++; const cell=getter(ti,ci); if(cell&&cell.score!=null)done++; });\n  const ts=(t.scored&&!na)? topicScore(t,(ci)=>getter(ti,ci)) : null;\n  const b=band(ts);\n  const open = t._open?'open':'';\n  const tscoreHtml = na ? `<span class=\"tscore\" style=\"background:var(--bg2);color:var(--muted);font-size:11px\">לא רלוונטי<\u002Fspan>`\n    : t.scored ? `<span class=\"tscore ${b.k?'bg-'+b.k:''}\">${ts==null?'—':Math.round(ts)}<\u002Fspan>`\n    : `<span class=\"tscore\" style=\"background:var(--bg2);color:var(--muted);font-size:11px\">איכותי<\u002Fspan>`;\n  const topicTools=`<div class=\"topic-tools\" onclick=\"event.stopPropagation()\">\n      <button class=\"tt-btn ${na?'on':''}\" onclick=\"toggleTopicNA('${scope}','${dimKey}',${ti})\" title=\"סמן נושא כלא רלוונטי / לא נבדק\">${svg('<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M4.9 4.9l14.2 14.2\"/>')}לא רלוונטי<\u002Fbutton>\n    <\u002Fdiv>`;\n  return `<div class=\"topic ${open} ${na?'topic-na':''}\" id=\"tp_${dimKey}_${ti}\">\n    <div class=\"topic-head\" onclick=\"toggleTopic('${dimKey}',${ti})\">\n      ${t.w?`<span class=\"tw\">${Math.round(t.w*100)}%<\u002Fspan>`:''}\n      <h4>${esc(t.name)}<\u002Fh4>\n      ${(t.scored&&!na)?ksTagHTML(scope,dimKey,ti,ts):''}\n      ${tot?`<span class=\"tprog\">${done}/${tot}<\u002Fspan>`:''}\n      ${tscoreHtml}\n      <svg class=\"caret\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M6 9l6 6 6-6\"/><\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"topic-body\">\n      ${topicTools}\n      ${(t.scored&&!na)?ksPickerHTML(scope,dimKey,ti,ts):''}\n      ${na?`<p class=\"muted\" style=\"font-size:13px;padding:4px 2px 12px\">הנושא סומן כלא רלוונטי / לא נבדק ואינו נכלל בחישוב הציון.<\u002Fp>`:''}\n      ${t.crits.map((c,ci)=>renderCrit(dimKey,ti,ci,c,getter(ti,ci),onScore,onNA)).join('')}\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n/* תגית שיפור/שימור בכותרת הנושא — נגזרת אוטומטית מהציון בלבד */\nfunction ksTagHTML(scope,dim,ti,score){\n  const cls=ksAuto(score);\n  if(cls==null) return `<span class=\"ks-tag none\">טרם דורג<\u002Fspan>`;\n  const ic=cls==='keep'?'<path d=\"M20 6L9 17l-5-5\"/>':'<path d=\"M12 20V10M6 20V4M18 20v-7\"/>';\n  return `<span class=\"ks-tag ${cls}\" id=\"kstag_${dim}_${ti}\">${svg(ic)}${ksLabel(cls)}<\u002Fspan>`;\n}\n/* שורת הסיווג בגוף הנושא — תצוגה בלבד, ללא אפשרות בחירה ידנית */\nfunction ksPickerHTML(scope,dim,ti,score){\n  const cls=ksAuto(score);\n  const txt = cls==null ? 'טרם נבחרו אפשרויות בנושא — הנושא אינו נכלל בריכוז השיפור/שימור'\n    : `ציון הנושא ${Math.round(score)} ${cls==='keep'?'&ge;':'&lt;'} ${KS_THRESHOLD} ולכן הנושא מסווג <b class=\"${cls}\">${ksLabel(cls)}<\u002Fb>`;\n  return `<div class=\"ks-picker\" id=\"kspick_${dim}_${ti}\">\n    <span class=\"kp-lbl\">${svg('<path d=\"M9 11l3 3L22 4\"/><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"/>')}סיווג הנושא<\u002Fspan>\n    <span class=\"kp-auto\">${txt}<\u002Fspan>\n  <\u002Fdiv>`;\n}\nfunction renderCrit(dimKey,ti,ci,c,cell,onPick,onNA){\n  const opts = c.opts||[];\n  const scored = c.w!=null;              // סעיף שאינו משוקלל — נבחר לתיעוד בלבד\n  const cur = cell?cell.score:null;\n  const curOpt = cell&&cell.opt!=null ? cell.opt : null;\n  const na = cell&&cell.score===null&&cell.naMark;\n  const filled = curOpt!=null;\n  const optsHTML = `<div class=\"opts\">${opts.map((o,oi)=>{\n      const on = curOpt===o.k;\n      const vc = o.s==null?'v-none':o.s>=80?'v-good':o.s>=60?'v-mid':'v-low';\n      const badge = o.s==null ? `<span class=\"osc none\">ללא ציון<\u002Fspan>` : `<span class=\"osc\">${o.s}<\u002Fspan>`;\n      return `<button class=\"opt ${on?'on '+vc:''}\" onclick=\"${onPick}('${dimKey}',${ti},${ci},'${o.k}')\">\n        <span class=\"ok\">${o.k}<\u002Fspan><span class=\"otx\">${esc(o.t)}<\u002Fspan>${badge}<\u002Fbutton>`;}).join('')}<\u002Fdiv>\n    <button class=\"score-na ${na?'on':''}\" onclick=\"${onNA}('${dimKey}',${ti},${ci})\">לא רלוונטי<\u002Fbutton>`;\n  const tag = c.bonus ? `<span class=\"crit-bonus\">${svg(SPARK)}שאלת בונוס<\u002Fspan>`\n            : !scored ? `<span class=\"crit-doconly\">${svg(ICONS.note)}לתיעוד בלבד — אינו משוקלל בציון<\u002Fspan>` : '';\n  return `<div class=\"crit ${filled?'filled':''}\">\n    <div class=\"ct\">${esc(c.t)}${tag}<\u002Fdiv>\n    <div class=\"cmeta\">\n      ${c.c?`<span>${svg(ICONS.talk)}${esc(c.c)}<\u002Fspan>`:''}\n      ${c.note?`<span class=\"note\">${svg(ICONS.note)}${esc(c.note)}<\u002Fspan>`:''}\n    <\u002Fdiv>\n    <div class=\"score-row\">${optsHTML}<\u002Fdiv>\n  <\u002Fdiv>`;\n}\n/* חיפוש אפשרות לפי אות; מחזיר את האפשרות או null */\nfunction critOpt(c,k){ return (c&&c.opts||[]).find(o=>o.k===k)||null; }\nfunction toggleTopic(dimKey,ti){\n  const topics = dimKey==='gph'?DATA.gph:DATA[dimKey];\n  topics[ti]._open=!topics[ti]._open;\n  document.getElementById('tp_'+dimKey+'_'+ti).classList.toggle('open');\n}\n/* ============ BRIGADE VIEW (gph) ============ */\nfunction viewBrigade(v){\n  const p=dimProgress((ti,ci)=>gphCell(ti,ci),DATA.gph);\n  const sc=gphScore(); const b=band(sc);\n  v.innerHTML=`\n  <div class=\"card subcard\" style=\"display:flex;align-items:center;gap:20px;margin-bottom:20px\">\n    <div style=\"flex:1\">\n      <p class=\"lead\" style=\"margin:0\">בחינת קיום נהלי הדרכה ברמת החטיבה / היחידה — מד\"ריה, גפ\"ה ומפקד החטיבה. ממד זה נבדק פעם אחת עבור היחידה הנסקרת ומשוקלל בציון המסכם.<\u002Fp>\n      <div style=\"margin-top:12px;display:flex;gap:18px;align-items:center;font-size:13px;color:var(--muted);font-weight:600\">\n        <span>הוזנו ${p.done} מתוך ${p.tot} קריטריונים<\u002Fspan>\n        <span style=\"flex:1;height:7px;background:var(--bg2);border-radius:10px;overflow:hidden;max-width:240px\"><span style=\"display:block;height:100%;width:${p.pct}%;background:linear-gradient(90deg,var(--olive-l),var(--olive))\"><\u002Fspan><\u002Fspan>\n        <span>${p.pct}%<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"text-align:center;padding-inline-start:20px;border-inline-start:1px solid var(--line)\">\n      <div style=\"font-size:42px;font-weight:900;letter-spacing:-1.5px\" class=\"${b.c}\">${fmt(sc)}<\u002Fdiv>\n      <div style=\"font-size:13px;font-weight:700\" class=\"${b.c}\">${b.t}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  ${DATA.gph.map((t,ti)=>renderTopic('gph',DATA.gph,ti,gphCell,'pickGph','naGph','gph')).join('')}\n  <div class=\"flow-foot\">\n    <button class=\"btn btn-ghost\" onclick=\"go('home')\">${svg('<path d=\"M19 12H5M12 5l-7 7 7 7\"/>')}חזרה להגדרות<\u002Fbutton>\n    <div class=\"spacer\"><\u002Fdiv>\n    <button class=\"btn btn-primary\" onclick=\"go('fw')\">המשך לביקורת מסגרות${svg('<path d=\"M19 12H5M12 19l-7-7 7-7\"/>')}<\u002Fbutton>\n  <\u002Fdiv>`;\n}\n/* בחירת אפשרות מבנק התשובות — הציון נגזר מהאפשרות ואינו מוזן ידנית.\n   לחיצה חוזרת על אותה אפשרות מבטלת את הבחירה. */\nfunction pickGph(_,ti,ci,k){ const c=DATA.gph[ti].crits[ci]; const cur=gphCell(ti,ci);\n  if(cur&&cur.opt===k){ setGph(ti,ci,{opt:null,score:null,naMark:false}); }\n  else { const o=critOpt(c,k); setGph(ti,ci,{opt:k,score:o?o.s:null,naMark:false}); }\n  refreshTopic('gph',ti); }\nfunction naGph(_,ti,ci){ const cur=gphCell(ti,ci); setGph(ti,ci,{opt:null,score:null,naMark:!(cur&&cur.naMark)}); refreshTopic('gph',ti); }\n\n/* ============ FRAMEWORK VIEW ============ */\nfunction viewFw(v){\n  if(!S.ui.activeFw||!S.frameworks.find(f=>f.id===S.ui.activeFw)) S.ui.activeFw=S.frameworks[0].id;\n  const fwId=S.ui.activeFw, dim=S.ui.dim;\n  const tabs=S.frameworks.map(f=>{ const pr=fwProgress(f.id);\n    return `<button class=\"fw-tab ${f.id===fwId?'active':''}\" onclick=\"selFw('${f.id}')\">\n      <span class=\"dot\" style=\"${pr.pct===100?'background:var(--good)':pr.pct>0?'background:var(--gold)':''}\"><\u002Fspan>\n      ${esc(f.label||'מסגרת')}<span class=\"pct\">${pr.pct}%<\u002Fspan><\u002Fbutton>`;}).join('');\n  const dimBtns=FW_DIMS.map(d=>{ const p=dimProgress((ti,ci)=>fwCell(fwId,d,ti,ci),DATA[d]);\n    return `<button class=\"${d===dim?'active':''} ${p.pct===100?'done':''}\" onclick=\"selDim('${d}')\">\n      ${DIM_META[d].label}<span class=\"mini\">${p.done}/${p.tot}${p.pct===100?' ✓':''}<\u002Fspan><\u002Fbutton>`;}).join('');\n  const topics=DATA[dim];\n  const idx=FW_DIMS.indexOf(dim);\n  const fwTot=fwScore(fwId); const fwTotB=band(fwTot);\n  const fwSummary=`<div class=\"fw-summary\">\n    <div class=\"fws-h\">${svg(ICONS.dash,'style=\"width:15px;height:15px\"')}הציונים שהתקבלו במסגרת זו<\u002Fdiv>\n    <div class=\"fws-grid\">\n      ${FW_DIMS.map(d=>{const val=fwDimScore(fwId,d);const bb=band(val);\n        return `<div class=\"fws-item ${d===dim?'cur':''}\"><span class=\"fws-lbl\">${DIM_META[d].label}<\u002Fspan><span class=\"fws-val ${bb.k?'bg-'+bb.k:''}\">${fmt(val)}<\u002Fspan><\u002Fdiv>`;}).join('')}\n      <div class=\"fws-item total\"><span class=\"fws-lbl\">ציון מסגרת<\u002Fspan><span class=\"fws-val ${fwTotB.k?'bg-'+fwTotB.k:''}\">${fmt(fwTot)}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n  v.innerHTML=`\n  <div class=\"fw-tabs\">${tabs}<\u002Fdiv>\n  <div class=\"dimbar\">${dimBtns}<\u002Fdiv>\n  ${fwSummary}\n  <p class=\"lead\" style=\"margin-bottom:16px\">${dimIntro(dim)}<\u002Fp>\n  ${topics.map((t,ti)=>renderTopic(dim,topics,ti,(a,b)=>fwCell(fwId,dim,a,b),'pickFw','naFw',fwId)).join('')}\n  <div class=\"flow-foot\">\n    <button class=\"btn btn-ghost\" onclick=\"${idx>0?`selDim('${FW_DIMS[idx-1]}')`:`go('brigade')`}\">${svg('<path d=\"M19 12H5M12 5l-7 7 7 7\"/>')}${idx>0?DIM_META[FW_DIMS[idx-1]].label:'רמת חטיבה'}<\u002Fbutton>\n    <div class=\"spacer\"><\u002Fdiv>\n    ${idx<FW_DIMS.length-1\n      ? `<button class=\"btn btn-primary\" onclick=\"selDim('${FW_DIMS[idx+1]}')\">${DIM_META[FW_DIMS[idx+1]].label}${svg('<path d=\"M19 12H5M12 19l-7-7 7-7\"/>')}<\u002Fbutton>`\n      : `<button class=\"btn btn-gold\" onclick=\"go('dash')\">${svg(ICONS.dash)}סיום — למסך העיבוד<\u002Fbutton>`}\n  <\u002Fdiv>`;\n}\nfunction dimIntro(d){return {\n  prog:'תכנית הכשרה — תיקי יסוד, תכנון מול ביצוע, מיצוי זמן, היערכות וסיכום מחזור, תיקי מדריך, מבחנים ולמידה מהשטח.',\n  cmd:'סגל — איתור מיון ושיבוץ, הכנת סגל, הערכת סגל, חניכת סגל ותחלופת מפקדים.',\n  trainee:'חניכים — מעקבים והסמכות, חניכה, חניך מתקשה, ועדות הערכה והעברת מקל.',\n}[d];}\nfunction selFw(id){ S.ui.activeFw=id; save(); render(); }\nfunction selDim(d){ S.ui.dim=d; save(); render(); window.scrollTo(0,0); }\nfunction pickFw(dim,ti,ci,k){ const c=DATA[dim][ti].crits[ci]; const fid=S.ui.activeFw; const cur=fwCell(fid,dim,ti,ci);\n  if(cur&&cur.opt===k){ setFw(fid,dim,ti,ci,{opt:null,score:null,naMark:false}); }\n  else { const o=critOpt(c,k); setFw(fid,dim,ti,ci,{opt:k,score:o?o.s:null,naMark:false}); }\n  refreshTopic(dim,ti); }\nfunction naFw(dim,ti,ci){ const fid=S.ui.activeFw; const cur=fwCell(fid,dim,ti,ci); setFw(fid,dim,ti,ci,{opt:null,score:null,naMark:!(cur&&cur.naMark)}); refreshTopic(dim,ti); }\n\n/* refresh just topic header score + dim bar without full rerender (keeps textareas focused) */\nfunction refreshTopic(dimKey,ti){\n  const topics = dimKey==='gph'?DATA.gph:DATA[dimKey];\n  const t=topics[ti];\n  const getter = dimKey==='gph'? gphCell : (a,b)=>fwCell(S.ui.activeFw,dimKey,a,b);\n  let done=0,tot=0; t.crits.forEach((c,ci)=>{if(c.w==null)return;tot++;const cell=getter(ti,ci);if(cell&&cell.score!=null)done++;});\n  const scope = dimKey==='gph' ? 'gph' : S.ui.activeFw;\n  const ts=(t.scored&&!isTopicNA(scope,dimKey,ti))?topicScore(t,(ci)=>getter(ti,ci)):null; const b=band(ts);\n  const el=document.getElementById('tp_'+dimKey+'_'+ti);\n  if(el){ const sc=el.querySelector('.tscore'); const pr=el.querySelector('.tprog');\n    if(sc&&t.scored){sc.className='tscore '+(b.k?'bg-'+b.k:''); sc.textContent=ts==null?'—':Math.round(ts);}\n    if(pr)pr.textContent=done+'/'+tot;\n    // refresh keep/improve tag + picker\n    if(t.scored){\n      const tag=el.querySelector('.ks-tag'); if(tag){ const nt=document.createElement('div'); nt.innerHTML=ksTagHTML(scope,dimKey,ti,ts); tag.replaceWith(nt.firstChild); }\n      const pick=el.querySelector('.ks-picker'); if(pick){ const np=document.createElement('div'); np.innerHTML=ksPickerHTML(scope,dimKey,ti,ts); pick.replaceWith(np.firstChild); }\n    }\n    // refresh crit chip states in this topic\n    t.crits.forEach((c,ci)=>{ const cell=getter(ti,ci); const cur=cell?cell.score:null;\n      const crit=el.querySelectorAll('.crit')[ci]; if(!crit)return;\n      crit.classList.toggle('filled',cell&&cell.opt!=null);\n      const curOpt=cell&&cell.opt!=null?cell.opt:null;\n      crit.querySelectorAll('.opt').forEach((btn,k)=>{ const o=(c.opts||[])[k]; if(!o)return;\n        const on=curOpt===o.k; const vc=o.s==null?'v-none':o.s>=80?'v-good':o.s>=60?'v-mid':'v-low';\n        btn.className='opt'+(on?(' on '+vc):''); });\n      const na=crit.querySelector('.score-na'); if(na)na.classList.toggle('on',cell&&cell.score===null&&cell.naMark);\n    });\n  }\n  // refresh nav badge + dimbar\n  renderNav();\n  if(nav==='fw'){ document.querySelectorAll('.dimbar button').forEach((btn,i)=>{ const d=FW_DIMS[i]; const p=dimProgress((a,b)=>fwCell(S.ui.activeFw,d,a,b),DATA[d]);\n    const mini=btn.querySelector('.mini'); if(mini)mini.textContent=`${p.done}/${p.tot}${p.pct===100?' ✓':''}`; btn.classList.toggle('done',p.pct===100); }); }\n}\n\n/* ============ DASHBOARD ============ */\nfunction viewDash(v){\n  const ov=overallScore(), b=band(ov);\n  const kpi=(label,val,feature)=>{ const bb=band(val);\n    return `<div class=\"card kpi ${feature?'feature':''}\"><div class=\"lbl\">${label}<\u002Fdiv>\n      <div class=\"val ${feature?'':bb.c}\">${fmt(val)}<small>/100<\u002Fsmall><\u002Fdiv>\n      <span class=\"tag ${feature?'':('bg-'+(bb.k||'mid'))}\" style=\"${feature?'background:rgba(255,255,255,.18);color:#fff':''}\">${bb.t}<\u002Fspan><\u002Fdiv>`;};\n  // matrix\n  const dims=['prog','cmd','trainee'];\n  const rows=S.frameworks.map(f=>{\n    const cells=dims.map(d=>{const s=fwDimScore(f.id,d);const bb=band(s);\n      return `<td>${s==null?'<span class=\"na\">—<\u002Fspan>':`<span class=\"cellscore bg-${bb.k}\">${Math.round(s)}<\u002Fspan>`}<\u002Ftd>`;}).join('');\n    const fs=fwScore(f.id);const fb=band(fs);\n    return `<tr><td>${esc(f.label||'מסגרת')} <span class=\"muted\" style=\"font-weight:400;font-size:11px\">${esc(f.kind)}<\u002Fspan><\u002Ftd>${cells}<td><span class=\"cellscore bg-${fb.k}\">${fmt(fs)}<\u002Fspan><\u002Ftd><\u002Ftr>`;\n  }).join('');\n  const gs=gphScore(),gb=band(gs);\n  const patterns=detectPatterns();\n  v.innerHTML=`\n  <div class=\"kpi-row\">\n    ${kpi('ציון מסכם משוקלל',ov,true)}\n    ${kpi('רמת חטיבה (גפ\"ה)',gs)}\n    ${kpi('תכנית הכשרה',dimAvgAcrossFw('prog'))}\n    ${kpi('סגל',dimAvgAcrossFw('cmd'))}\n    ${kpi('חניכים',dimAvgAcrossFw('trainee'))}\n  <\u002Fdiv>\n\n  <div class=\"card subcard\" style=\"margin-bottom:22px\">\n    <div class=\"section-h\"><span class=\"num\">${svg(ICONS.dash,'style=\"width:14px;height:14px\"')}<\u002Fspan><h3>חלוקת ציונים — מסגרות × ממדי הדרכה<\u002Fh3><p>${S.frameworks.length} מסגרות<\u002Fp><\u002Fdiv>\n    <div style=\"overflow-x:auto\">\n    <table class=\"matrix\">\n      <thead><tr><th>מסגרת<\u002Fth><th>תכנית הכשרה<\u002Fth><th>סגל<\u002Fth><th>חניכים<\u002Fth><th>ציון מסגרת<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>${rows||'<tr><td colspan=\"6\" class=\"muted\" style=\"text-align:center;padding:24px\">אין מסגרות<\u002Ftd><\u002Ftr>'}\n        <tr class=\"total-row\"><td>ממוצע רוחבי<\u002Ftd>\n          ${dims.map(d=>`<td>${fmt(dimAvgAcrossFw(d))}<\u002Ftd>`).join('')}\n          <td>${fmt(ov)}<\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"section-h\"><h3>זיהוי מגמות חוזרות<\u002Fh3><p>מאפיינים החוזרים על-עצמם במספר מסגרות — בסיס להתייחסות הרוחבית<\u002Fp><\u002Fdiv>\n  <div class=\"pattern-grid\" style=\"margin-bottom:24px\">\n    <div class=\"card pat-card keep\"><h4>${svg('<path d=\"M20 6L9 17l-5-5\"/>')}מאפיינים לשימור<\u002Fh4>\n      ${patterns.keep.length?patterns.keep.map(p=>`<div class=\"pat-item\">${esc(p.name)}<span class=\"pat-fw\">${p.fw} מסגרות<\u002Fspan><span class=\"pat-score bg-good\">${p.avg}<\u002Fspan><\u002Fdiv>`).join(''):'<p class=\"muted\" style=\"font-size:13px\">טרם זוהו מאפיינים חוזרים לשימור (ציון ≥ 85 בשתי מסגרות ומעלה).<\u002Fp>'}\n    <\u002Fdiv>\n    <div class=\"card pat-card improve\"><h4>${svg('<path d=\"M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\"/>')}מאפיינים לשיפור<\u002Fh4>\n      ${patterns.improve.length?patterns.improve.map(p=>`<div class=\"pat-item\">${esc(p.name)}<span class=\"pat-fw\">${p.fw} מסגרות<\u002Fspan><span class=\"pat-score bg-low\">${p.avg}<\u002Fspan><\u002Fdiv>`).join(''):'<p class=\"muted\" style=\"font-size:13px\">טרם זוהו מאפיינים חוזרים לשיפור (ציון ≤ 70 בשתי מסגרות ומעלה).<\u002Fp>'}\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"gen-hero no-print\">\n    <div class=\"gen-hero-txt\">\n      <h3>${svg('<path d=\"M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5z\"/><path d=\"M18 14l.8 2.4L21 17l-2.2.6L18 20l-.8-2.4L15 17l2.2-.6z\"/>','class=\"spark\"')}מחולל המלצות חכם<\u002Fh3>\n      <p>ניתוח הממצאים והציונים שהוזנו, והצעת טיוטות לכל סעיפי הדו\"ח — מבוסס על נהלי תקן \"יסודות מנצחים\". הטיוטות ניתנות לעריכה חופשית.<\u002Fp>\n    <\u002Fdiv>\n    <button class=\"btn btn-gold gen-all-btn\" onclick=\"genAll()\">${svg('<path d=\"M5 3v4M3 5h4M6 17v4M4 19h4M13 3l2.5 6.5L22 12l-6.5 2.5L13 21l-2.5-6.5L4 12l6.5-2.5z\"/>')}נסח טיוטות לכל הסעיפים<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div class=\"section-h\"><h3>ניסוח התייחסות רוחבית והנחיות<\u002Fh3><p>הטיוטות נשמרות אוטומטית וניתנות לעריכה לפני ההפקה<\u002Fp><\u002Fdiv>\n  ${acc('הערכה מסכמת',ICONS.brigade,`\n    <div class=\"gen-row\"><span class=\"gen-hint\">${svg(ICONS.note)}סיכום כולל של רמת היחידה לפי הציונים והממדים<\u002Fspan>\n      <button class=\"btn btn-ghost btn-sm\" onclick=\"genOne('summary')\">${svg(SPARK)}נסח טיוטה<\u002Fbutton><\u002Fdiv>\n    <textarea class=\"inp\" style=\"min-height:110px\" oninput=\"setRep('summary',this.value)\" placeholder=\"הערכה מסכמת של רמת ההדרכה ביחידה — הציון הכולל, הממדים החזקים והדורשים חיזוק, ותמונת המצב הכללית.\">${esc(S.report.summary||'')}<\u002Ftextarea>`,true)}\n  ${acc('הנחיות לטיפול מיידי',ICONS.report,`\n    <div class=\"gen-row\"><span class=\"gen-hint\">${svg(ICONS.note)}הנחיות מתוך הממצאים שדורשים טיפול, לפי סדר עדיפות<\u002Fspan>\n      <button class=\"btn btn-ghost btn-sm\" onclick=\"genOne('directives')\">${svg(SPARK)}נסח הנחיות<\u002Fbutton><\u002Fdiv>\n    <div id=\"dirs\">${S.report.directives.map((d,i)=>dirRow(d,i)).join('')}<\u002Fdiv>\n    <button class=\"btn btn-ghost btn-sm\" onclick=\"addDir()\">${svg('<path d=\"M12 5v14M5 12h14\"/>')}הוספת הנחיה<\u002Fbutton>`)}\n  ${acc('ריכוז שיפור/שימור (אוטומטי)',ICONS.check,`\n    <div class=\"gen-row\"><span class=\"gen-hint\">${svg(ICONS.note)}נבנה אוטומטית מהציון הסופי של כל נושא — ציון מתחת ל-${KS_THRESHOLD} נכנס לשיפור, ${KS_THRESHOLD} ומעלה לשימור. אין צורך בסימון ידני; הרשימות מתעדכנות עם כל שינוי ציון ונכללות בדו\"ח המופק.<\u002Fspan><\u002Fdiv>\n    ${ksReportHTML()}`,true)}\n  ${acc('ממצאים מרכזיים — הערות חופשיות',ICONS.note,`\n    <div class=\"gen-row\"><span class=\"gen-hint\">${svg(ICONS.note)}טקסט חופשי המתווסף לריכוז האוטומטי בדו\"ח — אופציונלי<\u002Fspan>\n      <button class=\"btn btn-ghost btn-sm\" onclick=\"genOne('trends')\">${svg(SPARK)}נסח מגמות והמלצות<\u002Fbutton><\u002Fdiv>\n    <label class=\"f\" style=\"margin-bottom:6px\">מאפייני פעילות הראויים לשימור<\u002Flabel>\n    <textarea class=\"inp\" oninput=\"setRep('trendsKeep',this.value)\" placeholder=\"הערות נוספות לשימור (אופציונלי)...\">${esc(S.report.trendsKeep)}<\u002Ftextarea>\n    <label class=\"f\" style=\"margin-top:12px\">מאפייני פעילות הראויים לשיפור<\u002Flabel>\n    <textarea class=\"inp\" oninput=\"setRep('trendsImprove',this.value)\" placeholder=\"הערות נוספות לשיפור (אופציונלי)...\">${esc(S.report.trendsImprove)}<\u002Ftextarea>\n    <label class=\"f\" style=\"margin-top:12px\">המלצות קונקרטיות<\u002Flabel>\n    <textarea class=\"inp\" oninput=\"setRep('recommendations',this.value)\" placeholder=\"המלצות לשיפור הנקודות שפורטו...\">${esc(S.report.recommendations)}<\u002Ftextarea>`)}\n\n  <div class=\"flow-foot\">\n    <button class=\"btn btn-ghost\" onclick=\"go('fw')\">${svg('<path d=\"M19 12H5M12 5l-7 7 7 7\"/>')}חזרה לאיסוף<\u002Fbutton>\n    <div class=\"spacer\"><\u002Fdiv>\n    <button class=\"btn btn-gold\" onclick=\"go('report')\">${svg(ICONS.report)}הפקת דו\"ח הסיכום<\u002Fbutton>\n  <\u002Fdiv>`;\n}\nfunction detectPatterns(){\n  const keep=[],improve=[];\n  ['prog','cmd','trainee'].forEach(dim=>{\n    DATA[dim].forEach((t,ti)=>{ if(!t.scored)return;\n      const scores=S.frameworks.filter(f=>!isTopicNA(f.id,dim,ti)).map(f=>topicScore(t,(ci)=>fwCell(f.id,dim,ti,ci))).filter(v=>v!=null);\n      if(scores.length<2)return;\n      const avg=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);\n      const lowN=scores.filter(s=>s<=70).length, highN=scores.filter(s=>s>=85).length;\n      if(highN>=2&&avg>=85) keep.push({name:t.name+' · '+DIM_META[dim].short,avg,fw:highN});\n      if(lowN>=2&&avg<=70) improve.push({name:t.name+' · '+DIM_META[dim].short,avg,fw:lowN});\n    });\n  });\n  keep.sort((a,b)=>b.avg-a.avg); improve.sort((a,b)=>a.avg-b.avg);\n  return {keep:keep.slice(0,6),improve:improve.slice(0,6)};\n}\nfunction suggestTrends(){\n  const p=detectPatterns();\n  if(p.keep.length&&!S.report.trendsKeep.trim()) S.report.trendsKeep=p.keep.map(x=>'• '+x.name+' (ממוצע '+x.avg+')').join('\\n');\n  if(p.improve.length&&!S.report.trendsImprove.trim()) S.report.trendsImprove=p.improve.map(x=>'• '+x.name+' (ממוצע '+x.avg+')').join('\\n');\n  save(); render(); toast('נוסחה טיוטה לפי המגמות שזוהו');\n}\nfunction acc(title,icon,body,open){ return `<div class=\"acc ${open?'open':''}\"><div class=\"acc-h\" onclick=\"this.parentNode.classList.toggle('open')\">\n  ${svg(icon,'class=\"ic\"')}<span>${title}<\u002Fspan><svg class=\"caret\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M6 9l6 6 6-6\"/><\u002Fsvg><\u002Fdiv>\n  <div class=\"acc-b\">${body}<\u002Fdiv><\u002Fdiv>`; }\nfunction dirRow(d,i){ return `<div class=\"dir-row\"><span class=\"num\">${i+1}<\u002Fspan>\n  <input class=\"inp\" value=\"${esc(d)}\" oninput=\"updDir(${i},this.value)\" placeholder=\"הנחיה לטיפול מיידי...\">\n  <button class=\"icon-btn\" onclick=\"delDir(${i})\">${svg('<path d=\"M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m-9 0v14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V6\"/>')}<\u002Fbutton><\u002Fdiv>`; }\nfunction setRep(k,v){ S.report[k]=v; save(); }\nfunction addDir(){ S.report.directives.push(''); save(); document.getElementById('dirs').insertAdjacentHTML('beforeend',dirRow('',S.report.directives.length-1)); }\nfunction updDir(i,v){ S.report.directives[i]=v; save(); }\nfunction delDir(i){ S.report.directives.splice(i,1); save(); render(); }\n\n/* ============ REPORT GENERATOR ============ */\nfunction viewReport(v){\n  v.innerHTML=`\n  <div class=\"report-toolbar no-print\">\n    <button class=\"btn btn-gold\" onclick=\"downloadReport()\">${svg('<path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3\"/>')}הורדה כקובץ Word<\u002Fbutton>\n    <button class=\"btn btn-ghost\" onclick=\"window.print()\">${svg('<path d=\"M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z\"/>')}הדפסה / שמירה כ-PDF<\u002Fbutton>\n    <div class=\"spacer\"><\u002Fdiv>\n    <span class=\"chip\">${svg(ICONS.check)}עודכן אוטומטית מהנתונים שהוזנו<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"note-banner no-print\">${svg('<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 16v-4M12 8h.01\"/>')}\n    <div>\"הורדה כקובץ Word\" תשמור קובץ ‎.doc‎ הנפתח ב-Word וניתן לעריכה מלאה — לצורך השלמות, ניסוח והוספת חתימות. בפתיחה ייתכן שיוצג חלון \"מצב תאימות\" — יש לאשר, ולשמור בסיום כ-‎.docx‎ דרך \"שמור בשם\".<\u002Fdiv><\u002Fdiv>\n  <div class=\"paper\" id=\"paper\">${reportHTML()}<\u002Fdiv>`;\n}\n/* קבוצת שמות כל הנושאים — לזיהוי כותרות גם בתוכן ישן שנשמר ללא הסימון ## */\nconst ALL_TOPIC_NAMES = (()=>{ const s=new Set();\n  ['gph','prog','cmd','trainee'].forEach(d=>(DATA[d]||[]).forEach(t=>s.add(t.name))); return s; })();\n/* עיבוד תוכן שדה ממצאים למבנה: שורת \"## X\" = כותרת נושא, \"• Y\" = בולט, אחר = שורה רגילה */\nfunction findingsBlockHTML(txt){\n  const raw=(txt||'').replace(/\\s+$/,'');\n  if(!raw.trim()) return '<p style=\"white-space:pre-line\">—<\u002Fp>';\n  const lines=raw.split('\\n');\n  let html='', bulletsOpen=false, groupsOpen=false;\n  const closeBul=()=>{ if(bulletsOpen){ html+='<\u002Ful>'; bulletsOpen=false; } };\n  lines.forEach(line=>{\n    const t=line.trim();\n    if(!t){ closeBul(); return; }\n    if(t.startsWith('## ') || ALL_TOPIC_NAMES.has(t)){   // כותרת נושא (כולל תוכן ישן ללא ##)\n      closeBul();\n      if(!groupsOpen){ html+='<div class=\"find-groups\">'; groupsOpen=true; }\n      html+=`<div class=\"find-topic\">${esc(t.startsWith('## ')?t.slice(3).trim():t)}<\u002Fdiv>`;\n    } else if(t.startsWith('•')){                   // בולט\n      if(!bulletsOpen){ html+='<ul class=\"find-ul\">'; bulletsOpen=true; }\n      html+=`<li>${esc(t.replace(/^•\\s*/,''))}<\u002Fli>`;\n    } else {                                        // טקסט חופשי (עריכה ידנית)\n      closeBul();\n      html+=`<p class=\"find-line\">${esc(t)}<\u002Fp>`;\n    }\n  });\n  closeBul();\n  if(groupsOpen) html+='<\u002Fdiv>';\n  return html;\n}\nfunction reportHTML(){\n  const m=S.meta, c=m.commander;\n  const ov=overallScore(),ob=band(ov);\n  const cmdLine = [c.rank,c.name].filter(Boolean).join(' ')+(c.role?' — '+c.role:'');\n  // section 2 table\n  const dims=['prog','cmd','trainee'];\n  const dimHead='<th>תכנית הכשרה<\u002Fth><th>סגל<\u002Fth><th>חניכים<\u002Fth><th>ציון / הערכת הממד<\u002Fth>';\n  const fwRows=S.frameworks.map(f=>{\n    const cells=dims.map(d=>{const s=fwDimScore(f.id,d);return `<td class=\"c scorecell\">${s==null?'—':Math.round(s)}<\u002Ftd>`;}).join('');\n    const fs=fwScore(f.id);const fb=band(fs);\n    return `<tr><td><b>${esc(f.label||'מסגרת')}<\u002Fb><\u002Ftd>${cells}<td class=\"c scorecell\">${fmt(fs)} ${fb.t!=='—'?'· '+fb.t:''}<\u002Ftd><\u002Ftr>`;\n  }).join('');\n  // inspectors / frameworks listing\n  const fwList=S.frameworks.map(f=>{const ins=S.inspectors.find(p=>p.id===f.inspectorId);\n    return `<li><b>${esc(f.label||'מסגרת')}<\u002Fb> (${esc(f.kind)}) — נבדקה ע\"י: ${ins?[ins.rank,ins.name].filter(Boolean).join(' ')+(ins.role?', '+ins.role:''):'לא הוקצה'}<\u002Fli>`;}).join('');\n  const dirs=S.report.directives.filter(d=>d.trim());\n  // section 5 findings tables\n  const findTables = S.frameworks.map(f=>frameworkFindings(f)).join('');\n  return `\n  <div class=\"doc-class\">— בלמ\"ס —<\u002Fdiv>\n  <div class=\"doc-title\"><h1>דו\"ח סיכום ביקורת הדרכה${m.unit?' — '+esc(m.unit):''}<\u002Fh1>\n    <div class=\"sub\">${esc(m.name||'')}${ranges()?' · '+ranges():''}<\u002Fdiv><\u002Fdiv>\n\n  <div class=\"rsec\">\n    <div class=\"rsec-h\"><span class=\"n\">1<\u002Fspan><h3>כללי<\u002Fh3><\u002Fdiv>\n    <div class=\"kv\"><b>תאריך הביקורת:<\u002Fb><span>${ranges()||'—'}<\u002Fspan><\u002Fdiv>\n    <div class=\"kv\"><b>היחידה שנסקרה:<\u002Fb><span>${esc(m.unit)||'—'}<\u002Fspan><\u002Fdiv>\n    <div class=\"kv\"><b>שם / סוג הביקורת:<\u002Fb><span>${esc(m.name)} · ${esc(m.type)}${m.integrative?' · '+esc(m.integrative):''}<\u002Fspan><\u002Fdiv>\n    <div class=\"kv\"><b>מפקד הביקורת:<\u002Fb><span>${esc(cmdLine)||'—'}<\u002Fspan><\u002Fdiv>\n    <p style=\"margin-top:8px\"><b style=\"color:var(--olive-d)\">המסגרות הנבדקות וצוות הביקורת:<\u002Fb><\u002Fp>\n    <ul>${fwList||'<li>—<\u002Fli>'}<\u002Ful>\n    <p style=\"margin-top:8px\"><b style=\"color:var(--olive-d)\">שיטת הביקורת:<\u002Fb><\u002Fp>\n    <ul>\n      <li><b>ברמת החטיבה:<\u002Fb> ${esc(m.methodBrigade)||'בחינת קיום נהלי הדרכה לכלל הגדודים והענפים, בהובלת המד\"ריה / גפ\"ה ומפקד החטיבה.'}<\u002Fli>\n      <li><b>ברמת המסגרת:<\u002Fb> ${esc(m.methodFramework)||'בחינת המסגרת על-פי שלושת ממדי ההדרכה — תכנית הכשרה, סגל וחניכים.'}<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n\n  <div class=\"rsec\">\n    <div class=\"rsec-h\"><span class=\"n\">2<\u002Fspan><h3>הערכה מסכמת וציון הביקורת<\u002Fh3><\u002Fdiv>\n    ${S.report.summary&&S.report.summary.trim()?`<p style=\"white-space:pre-line;margin-bottom:10px\">${esc(S.report.summary)}<\u002Fp>`:''}\n    <p>הציון המסכם המשוקלל של הביקורת: <b style=\"font-size:18px\" class=\"${ob.c}\">${fmt(ov)}<\u002Fb> / 100 — ${ob.t}.\n    ${(gphScore()!=null)?` ציון רמת החטיבה (גפ\"ה): <b>${fmt(gphScore())}<\u002Fb>.`:''}<\u002Fp>\n    <table class=\"rtable\"><thead><tr><th>מסגרת / ממד הדרכה<\u002Fth>${dimHead}<\u002Ftr><\u002Fthead>\n      <tbody>${fwRows||'<tr><td colspan=\"6\" class=\"c\">—<\u002Ftd><\u002Ftr>'}\n      <tr style=\"background:var(--olive-soft);font-weight:800\"><td><b>ציון מסכם<\u002Fb><\u002Ftd>\n        ${dims.map(d=>`<td class=\"c\">${fmt(dimAvgAcrossFw(d))}<\u002Ftd>`).join('')}<td class=\"c\">${fmt(ov)}<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable>\n  <\u002Fdiv>\n\n  <div class=\"rsec\">\n    <div class=\"rsec-h\"><span class=\"n\">3<\u002Fspan><h3>הנחיות לטיפול<\u002Fh3><\u002Fdiv>\n    ${dirs.length?`<ul>${dirs.map(d=>`<li>${esc(d)}<\u002Fli>`).join('')}<\u002Ful>`:'<p class=\"muted\">לא הוזנו הנחיות לטיפול.<\u002Fp>'}\n  <\u002Fdiv>\n\n  <div class=\"rsec\">\n    <div class=\"rsec-h\"><span class=\"n\">4<\u002Fspan><h3>ממצאים מרכזיים<\u002Fh3><\u002Fdiv>\n    ${ksReportHTML()}\n    ${S.report.trendsKeep.trim()?`<p style=\"margin-top:16px\"><b style=\"color:var(--olive-d)\">מאפייני פעילות הראויים לשימור:<\u002Fb><\u002Fp>${findingsBlockHTML(S.report.trendsKeep)}`:''}\n    ${S.report.trendsImprove.trim()?`<p style=\"margin-top:14px\"><b style=\"color:var(--olive-d)\">מאפייני פעילות הראויים לשיפור:<\u002Fb><\u002Fp>${findingsBlockHTML(S.report.trendsImprove)}`:''}\n    ${S.report.recommendations.trim()?`<p style=\"margin-top:14px\"><b style=\"color:var(--olive-d)\">המלצות קונקרטיות:<\u002Fb><\u002Fp>${findingsBlockHTML(S.report.recommendations)}`:''}\n  <\u002Fdiv>\n\n  <div class=\"rsec\">\n    <div class=\"rsec-h\"><span class=\"n\">5<\u002Fspan><h3>ממצאים מרכזיים בתחום ההדרכה<\u002Fh3><\u002Fdiv>\n    ${brigadeFindings()}\n    ${findTables||'<p class=\"muted\">לא הוזנו ממצאים ברמת המסגרות.<\u002Fp>'}\n  <\u002Fdiv>`;\n}\nfunction findingsTable(dimKey,topics,getter){\n  const dim = dimKey==='gph'?'gph':dimKey;\n  const rows=topics.map((t,ti)=>{\n    if(!t.scored) return '';\n    const ts=topicScore(t,(ci)=>getter(ti,ci));\n    const crits=topicCrits(dim,ti,getter);\n    if(ts==null&&!crits.length) return '';\n    // שורת הנושא הכללי, ומתחתיה שורה לכל תת-נושא עם התשובה שנבחרה\n    const head=`<tr class=\"ftopic\"><td><b>${esc(t.name)}<\u002Fb><\u002Ftd><td class=\"c\">—<\u002Ftd>\n      <td class=\"c\"><b>${ts==null?'—':Math.round(ts)}<\u002Fb><\u002Ftd><\u002Ftr>`;\n    const sub=crits.map(c=>`<tr><td class=\"fsub\">${esc(c.t)}<\u002Ftd>\n      <td>${esc(c.optText)}<\u002Ftd><td class=\"c\">${c.score==null?'—':c.score}<\u002Ftd><\u002Ftr>`).join('');\n    return head+sub;\n  }).filter(Boolean).join('');\n  if(!rows) return '';\n  return `<table class=\"rtable\"><thead><tr><th style=\"width:34%\">נושא / תת-נושא<\u002Fth>\n    <th>התשובה שנבחרה<\u002Fth><th style=\"width:9%\" class=\"c\">ציון<\u002Fth><\u002Ftr><\u002Fthead><tbody>${rows}<\u002Ftbody><\u002Ftable>`;\n}\nfunction brigadeFindings(){\n  const tbl=findingsTable('gph',DATA.gph,gphCell);\n  if(!tbl) return '';\n  return `<div class=\"subhead\">ברמת החטיבה — מסגרת הגפ\"ה / מד\"ריה <span class=\"pill bg-${band(gphScore()).k}\">${fmt(gphScore())}<\u002Fspan><\u002Fdiv>${tbl}`;\n}\nfunction frameworkFindings(f){\n  const parts=FW_DIMS.map(d=>{\n    const tbl=findingsTable(d,DATA[d],(ti,ci)=>fwCell(f.id,d,ti,ci));\n    if(!tbl)return '';\n    const s=fwDimScore(f.id,d);\n    return `<div class=\"subhead\" style=\"font-size:13.5px;margin-top:13px\">ממד ${DIM_META[d].label} ${s!=null?`<span class=\"pill bg-${band(s).k}\">${Math.round(s)}<\u002Fspan>`:''}<\u002Fdiv>${tbl}`;\n  }).filter(Boolean).join('');\n  if(!parts) return '';\n  return `<div class=\"subhead\" style=\"margin-top:20px;font-size:15px;border-top:1px solid var(--line);padding-top:14px\">מסגרת ${esc(f.label||'')} <span class=\"pill bg-${band(fwScore(f.id)).k}\">${fmt(fwScore(f.id))}<\u002Fspan><\u002Fdiv>${parts}`;\n}\n\n/* ============ import/export/reset ============ */\nfunction exportJSON(){ const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});\n  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);\n  a.download=`ביקורת_${((S.meta.unit||'').replace(/[\"'<>:|?*\\\\/]/g,'').replace(/\\s+/g,'_').trim())||'הדרכה'}.json`; a.click(); toast('הנתונים יוצאו'); }\nfunction importJSON(e){ const f=e.target.files[0]; if(!f)return; const r=new FileReader();\n  r.onload=()=>{try{S=Object.assign(BLANK(),JSON.parse(r.result));S.ui=S.ui||{dim:'prog',activeFw:null};S.topicNA=S.topicNA||{};delete S.ks;delete S.pinned;save();render();toast('הגיבוי נטען בהצלחה');}catch(x){toast('שגיאה בטעינת הקובץ');}}; r.readAsText(f); e.target.value=''; }\n/* ייצוא הדו\"ח כקובץ Word ניתן לעריכה (.doc) — נפתח ב-Word/WPS/Google Docs ללא תוספים */\nfunction downloadReport(){\n  const wordCss = `\n@page{size:A4;margin:2cm 2cm 2cm 2cm;mso-page-orientation:portrait}\nbody{font-family:Arial,'David',sans-serif;font-size:11pt;color:#000;direction:rtl;text-align:right}\ndiv,p,td,th,li{direction:rtl;text-align:right}\n.paper{width:100%}\n.doc-class{text-align:center;font-size:9pt;font-weight:bold;color:#444;letter-spacing:2px;\n  border-bottom:1pt solid #999;padding-bottom:6pt;margin-bottom:16pt}\n.doc-title{text-align:center;margin-bottom:18pt}\n.doc-title h1{font-size:18pt;font-weight:bold;margin:0}\n.doc-title .sub{font-size:10.5pt;color:#444;margin-top:4pt}\n.rsec{margin-bottom:16pt}\n.rsec-h{border-bottom:1.5pt solid #1e3f68;padding-bottom:4pt;margin-bottom:8pt}\n.rsec-h .n{display:inline-block;border:1pt solid #1e3f68;color:#1e3f68;font-weight:bold;\n  font-size:10pt;padding:0 6pt;margin-left:6pt}\n.rsec-h h3{display:inline;font-size:13.5pt;font-weight:bold;color:#1e3f68;margin:0}\n.rsec p,.rsec li{font-size:11pt;line-height:1.5}\n.rsec .kv{margin-bottom:3pt;font-size:11pt}\n.rsec .kv b{color:#1e3f68}\n.rtable{width:100%;border-collapse:collapse;margin:8pt 0;font-size:10pt}\n.rtable th,.rtable td{border:0.75pt solid #999;padding:4pt 6pt;text-align:right;vertical-align:top}\n.rtable th{background:#e8eff8;font-weight:bold;color:#1e3f68}\n.rtable td.c,.rtable th.c{text-align:center}\n.rtable tr.ftopic td{background:var(--olive-soft);font-weight:800}\n.rtable td.fsub{padding-inline-start:22px;color:var(--ink2)}\n.subhead{font-size:11.5pt;font-weight:bold;color:#1e3f68;margin:10pt 0 4pt}\n/* ממצאים מרכזיים — כותרת נושא ורשימת נקודות תקנית ל-Word */\n.find-topic{font-size:11.5pt;font-weight:bold;color:#1e3f68;margin:9pt 0 3pt;\n  border-bottom:0.75pt solid #cfd9e6;padding-bottom:2pt}\n.find-ul{margin:0 0 4pt 0;padding:0}\n.find-ul li{list-style:disc;margin-right:18pt;font-size:11pt;line-height:1.5}\n.find-line{font-size:11pt;line-height:1.5;margin:0 0 2pt}\n/* ריכוז שיפור/שימור — פריסה מוערמת (Word אינו תומך ב-grid) */\n.ks-report{width:100%}\n.ks-col{margin-bottom:12pt}\n.ks-col h4{font-size:12pt;font-weight:bold;color:#1e3f68;border-bottom:1pt solid #1e3f68;\n  padding-bottom:2pt;margin:0 0 5pt}\n.ks-col h4 svg{display:none}\n.ks-col h4 .cnt{font-size:9.5pt;font-weight:normal;color:#555;margin-right:6pt}\n.ks-entry{border:0.75pt solid #bbb;padding:5pt 7pt;margin-bottom:5pt}\n.ks-entry .kh b{font-size:11pt}\n.ks-entry .kh .area{font-size:9.5pt;color:#555;margin-right:6pt}\n.ks-entry .kh .sc{font-size:9.5pt;font-weight:bold;margin-right:6pt}\n.ks-crits{margin-top:3pt;border-top:0.5pt solid #ccc;padding-top:3pt}\n.ks-crit{margin-bottom:3pt;font-size:10pt}\n.ks-crit .cscore{font-weight:bold;font-size:9.5pt;color:#1e3f68;margin-left:6pt}\n.ks-crit .ctxt b{font-weight:bold;font-size:10pt}\n.ks-crit .ctxt .cans{color:#444;font-size:10pt}\n.rtable tr.ftopic td{background:#e8eff8;font-weight:bold}\n.rtable td.fsub{padding-right:16pt;color:#333}\n.ks-empty{font-size:10.5pt;color:#555}\n.cbadge{font-weight:bold;font-size:9pt;border:0.5pt solid #777;padding:0 4pt;margin-left:4pt}\n.muted{color:#555}`;\n\n  const html = `<html xmlns:o=\"urn:schemas-microsoft-com:office:office\" `\n    + `xmlns:w=\"urn:schemas-microsoft-com:office:word\" xmlns=\"http://www.w3.org/TR/REC-html40\" dir=\"rtl\" lang=\"he\">`\n    + `<head><meta charset=\"utf-8\"><title>${esc('דוח סיכום ביקורת — '+(S.meta.unit||''))}<\u002Ftitle>`\n    + `<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print<\u002Fw:View><w:Zoom>100<\u002Fw:Zoom>`\n    + `<w:DoNotOptimizeForBrowser/><\u002Fw:WordDocument><\u002Fxml><![endif]-->`\n    + `<style>${wordCss}<\u002Fstyle><template id=\"__bundler_thumbnail\" data-bg-color=\"#1d2740\">\n  <svg viewBox=\"0 0 1200 800\" xmlns=\"http://www.w3.org/2000/svg\">\n    <rect width=\"1200\" height=\"800\" fill=\"#1d2740\"/>\n    <circle cx=\"600\" cy=\"400\" r=\"230\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"26\" opacity=\"0.9\"/>\n    <circle cx=\"600\" cy=\"400\" r=\"168\" fill=\"none\" stroke=\"#2e79c9\" stroke-width=\"14\"/>\n    <path d=\"M508 400l62 62 128-128\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"30\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n    <rect x=\"560\" y=\"140\" width=\"80\" height=\"34\" fill=\"#ffffff\"/>\n    <rect x=\"560\" y=\"626\" width=\"80\" height=\"34\" fill=\"#ffffff\"/>\n    <rect x=\"326\" y=\"383\" width=\"34\" height=\"34\" fill=\"#ffffff\"/>\n    <rect x=\"840\" y=\"383\" width=\"34\" height=\"34\" fill=\"#ffffff\"/>\n  <\u002Fsvg>\n<\u002Ftemplate>\n<\u002Fhead>`\n    + `<body dir=\"rtl\"><div class=\"paper\">${reportHTML()}<\u002Fdiv><\u002Fbody><\u002Fhtml>`;\n\n  // BOM כדי ש-Word יזהה UTF-8 ולא ישבש עברית\n  const blob = new Blob(['\\ufeff', html], {type:'application/msword'});\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob);\n  const safeUnit=(S.meta.unit||'').replace(/[\"'<>:|?*\\\\/]/g,'').replace(/\\s+/g,'_').trim();\n  a.download = `דוח_סיכום_${safeUnit||'ביקורת'}.doc`;\n  a.click();\n  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);\n  toast('הדו\"ח הורד כקובץ Word — ניתן לעריכה');\n}\nfunction resetAll(){ if(confirm('לאפס את כל נתוני הביקורת? פעולה זו אינה הפיכה. מומלץ לייצא גיבוי קודם.')){ S=BLANK(); save(); nav='home'; render(); toast('הביקורת אופסה'); } }\n\n/* ============ init ============ */\nload();\nrender();\n\n/* ============ מחולל המלצות מבוסס-דוקטרינה ============ */\n/* בסיס ידע מתומצת מנהלי תקן \"יסודות מנצחים\" (ינואר 24).\n   ref = מס' הנוהל לציטוט · std = הסטנדרט הנדרש · fix = הפעולה המתקנת */\nconst KB = {\n  gph:{\n    'שעון פעילות הדרכה':{ref:'1.2',fix:'להסדיר ולפרסם שעון פעילות הדרכה הכולל את כלל המופעים הנדרשים, ולוודא את הטמעתו בקרב בעלי התפקידים'},\n    'אבחון הדרכה':{ref:'1.3',fix:'להסדיר תהליך אבחון הדרכתי שיטתי ומתועד, ולגזור ממנו את תכנית העבודה'},\n    'תוכנית עבודה הדרכתית':{ref:'1.4',fix:'לעגן תכנית עבודה הדרכתית מתועדת הנגזרת מהאבחון, עם יעדים, אחראים ולוחות זמנים'},\n    'פורום למידה':{ref:'3.8',fix:'לקבע פורום הדרכה בה\"די בתדירות מוגדרת, ולתעד את החלטותיו ומעקב הביצוע'},\n    'תיקי יסוד':{ref:'2.2',fix:'להשלים כתיבה, עדכון ואישור של תיקי היסוד החסרים בהתאם לנוהל'},\n    'ביקורת הדרכה':{ref:'1.9',fix:'לקבע מנגנון בקרות תו-תקן פנימיות אחת למחזור, לתעד ממצאים ולעקוב אחר סגירתם'},\n    'משוב שטח':{ref:'1.8',fix:'להסדיר איסוף משוב שטח שיטתי מהיחידות הקולטות והזנתו חזרה ללמידה ולעדכון ההכשרה'},\n    'הכשרת בעלי תפקידים':{ref:'3.5',fix:'להשלים הכשרות הדרכה לבעלי התפקידים שטרם הוכשרו ולקבע מעקב כשירות'},\n    'פיתוח הדרכה':{ref:'2.1',fix:'להסדיר תהליך פיתוח הדרכה מתועד — אפיון הצורך, פיתוח ואישור'},\n  },\n  prog:{\n    'תיק יסוד ומימושו':{ref:'2.2',fix:'להשלים, לתקף ולאשר את תיק היסוד, וליישר את ההוראה בפועל מול המוגדר בו'},\n    'הסמכות':{ref:'4.4',fix:'לקבע פורום הסמכות בראשות מג\"ד ולנהל תמונת מצב הסמכות עדכנית ומתועדת'},\n    'מיצוי זמן ההכשרה':{ref:'1.4',fix:'למפות פערי ניצול של זמן ההדרכה ולהסדיר מיצוי מיטבי של שעות ההכשרה'},\n    'היערכות לפתיחת מחזור':{ref:'1.5',fix:'להסדיר תהליך היערכות מובנה לפתיחת מחזור הכולל בדיקות מוכנות'},\n    'סיכום מחזור הכשרה':{ref:'1.7',fix:'לקבע תהליך סיכום סוף-מחזור מתועד, עם לקחים המוטמעים למחזור הבא'},\n    'סיכומים עיתיים':{ref:'1.6',fix:'להסדיר סיכומים עיתיים ומתועדים תוך-כדי המחזור כבסיס לקבלת החלטות בזמן'},\n    'תיק מדריך':{ref:'2.4',fix:'להשלים ולתקף תיקי מדריך בהתאם לנוהל'},\n    'כלי הערכה':{ref:'2.3',fix:'ליישר את מערך כלי ההערכה — מבחנים, תשובונים ודפי הערכה — לסטנדרט הנדרש בנוהל'},\n    'למידה מהשטח':{ref:'1.8',fix:'להסדיר ערוץ למידה מהשטח והטמעתו בתכנית ההכשרה'},\n  },\n  cmd:{\n    'איתור, מיון ושיבוץ סגל':{ref:'3.2',fix:'להסדיר תהליך מתועד לאיתור, מיון ושיבוץ סגל מול דרישות התפקיד'},\n    'הכנת סגל':{ref:'3.3',fix:'להסדיר תכנית הכנת סגל מובנית טרם פתיחת המחזור ובמהלכו'},\n    'הערכת סגל':{ref:'3.4',fix:'לקבע מנגנון הערכת סגל עיתי ומתועד הכולל משוב מסכם'},\n    'חניכת סגל':{ref:'3.4',fix:'להסדיר חניכת סגל שוטפת ומתועדת על-ידי הדרג הממונה'},\n    'תחלופת מפקדים':{ref:'3.6',fix:'להסדיר תהליך תחלופת מפקדים מובנה הכולל חפיפה מתועדת'},\n  },\n  trainee:{\n    'מעקבים והסמכות':{ref:'4.4',fix:'להסדיר מעקב הסמכות מלא ומעודכן בתיק האישי לחניך'},\n    'חניכה':{ref:'4.4',fix:'להסדיר שגרת חניכה אישית מתועדת לחניכים'},\n    'חניך מתקשה':{ref:'4.1',fix:'לקבע תהליך טיפול בחניך מתקשה — זיהוי מוקדם ותכנית מענה מתועדת'},\n    'ועדות הערכה':{ref:'4.2',fix:'להסדיר קיום ועדות להערכת חניך, מתועדות ובהתאם לנוהל'},\n    'העברת מקל':{ref:'4.5',fix:'להסדיר תהליך \"העברת מקל\" מתועד הכולל העברת מידע ליחידה הקולטת'},\n  },\n};\nconst SHORT2DIM = {};\nObject.keys(DIM_META).forEach(d=>{ SHORT2DIM[DIM_META[d].short]=d; });\nfunction kbOf(dim,name){ return (KB[dim]&&KB[dim][name])||{ref:'',fix:'לטפל בפער שזוהה ולהביא את הנושא לעמידה בנוהל'}; }\n\n\n/* סריקת כלל הממצאים שהוזנו — חטיבה + מסגרות × ממדים */\nfunction scanFindings(){\n  const out=[];\n  DATA.gph.forEach((t,ti)=>{ if(!t.scored||isTopicNA('gph','gph',ti))return;\n    const sc=topicScore(t,(ci)=>gphCell(ti,ci));\n    const finds=topicCrits('gph',ti,gphCell).filter(c=>c.score!=null&&c.score<70).map(c=>c.optText);\n    if(sc==null&&!finds.length)return;\n    out.push({dim:'gph',name:t.name,scope:'רמת החטיבה (גפ\"ה)',score:sc,find:finds.join('; ')});\n  });\n  S.frameworks.forEach(f=>{\n    FW_DIMS.forEach(dim=>{\n      DATA[dim].forEach((t,ti)=>{ if(!t.scored||isTopicNA(f.id,dim,ti))return;\n        const sc=topicScore(t,(ci)=>fwCell(f.id,dim,ti,ci));\n        const finds=topicCrits(dim,ti,(a,b)=>fwCell(f.id,dim,a,b)).filter(c=>c.score!=null&&c.score<70).map(c=>c.optText);\n        if(sc==null&&!finds.length)return;\n        out.push({dim,name:t.name,scope:(f.label||'מסגרת')+' · '+DIM_META[dim].short,score:sc,find:finds.join('; ')});\n      });\n    });\n  });\n  return out;\n}\n\n/* ====== איסוף סיווג שיפור/שימור לדוח ======\n   scanKS(): כל נושא שדורג — שמו, ציונו הסופי, סיווגו, ופירוט תתי-הנושאים\n   (הקריטריונים) שבו, כל אחד עם התשובה שנבחרה מבנק התשובות והציון שלה. */\n/* פירוט הקריטריונים בנושא — שם הקריטריון, התשובה שנבחרה וציונה */\nfunction topicCrits(dim,ti,getter){\n  const t=(dim==='gph'?DATA.gph:DATA[dim])[ti];\n  const out=[];\n  t.crits.forEach((c,ci)=>{\n    if(c.w==null)return;                       // סעיף שאינו משוקלל בציון\n    const cell=getter(ti,ci); if(!cell||cell.opt==null)return;\n    const o=critOpt(c,cell.opt); if(!o)return;\n    out.push({ci,t:c.t,optK:o.k,optText:o.t,score:o.s});\n  });\n  return out;\n}\nfunction scanKS(){\n  const out=[];\n  // רמת החטיבה\n  DATA.gph.forEach((t,ti)=>{ if(!t.scored||isTopicNA('gph','gph',ti))return;\n    const sc=topicScore(t,(ci)=>gphCell(ti,ci)); if(sc==null)return;\n    const cls=ksAuto(sc); if(!cls)return;\n    out.push({scope:'gph',dim:'gph',ti,name:t.name,area:'רמת החטיבה (גפ\"ה)',score:sc,cls,\n      crits:topicCrits('gph',ti,gphCell)});\n  });\n  // רמת המסגרות × ממדים\n  S.frameworks.forEach(f=>{\n    FW_DIMS.forEach(dim=>{\n      DATA[dim].forEach((t,ti)=>{ if(!t.scored||isTopicNA(f.id,dim,ti))return;\n        const sc=topicScore(t,(ci)=>fwCell(f.id,dim,ti,ci)); if(sc==null)return;\n        const cls=ksAuto(sc); if(!cls)return;\n        out.push({scope:f.id,dim,ti,name:t.name,area:(f.label||'מסגרת')+' · '+DIM_META[dim].short,\n          score:sc,cls,crits:topicCrits(dim,ti,(a,b)=>fwCell(f.id,dim,a,b))});\n      });\n    });\n  });\n  return out;\n}\n\n/* ====== ריכוז שיפור/שימור אוטומטי לדו\"ח ======\n   מקור יחיד לאמת: הציון הסופי של כל נושא (topicScore).\n     ציון <  KS_THRESHOLD  =>  שיפור\n     ציון >= KS_THRESHOLD  =>  שימור\n   נושא נכלל אך ורק אם יש לו ציון מחושב — נושא איכותי (scored=false),\n   נושא שסומן \"לא רלוונטי\", או נושא שטרם דורג, אינם מופיעים באף רשימה. */\nfunction ksBuckets(){\n  const all=scanKS();\n  const bySide=cls=>all.filter(x=>x.cls===cls).sort((a,b)=>a.score-b.score||a.name.localeCompare(b.name,'he'));\n  return {improve:bySide('improve'), keep:bySide('keep')};\n}\nfunction ksEntryHTML(x){\n  const b=band(x.score);\n  const crits=x.crits||[];\n  return `<div class=\"ks-entry\">\n    <div class=\"kh\"><b>${esc(x.name)}<\u002Fb><span class=\"area\">${esc(x.area)}<\u002Fspan>\n      <span class=\"sc ${b.k?'bg-'+b.k:''}\">${Math.round(x.score)}<\u002Fspan><\u002Fdiv>\n    ${crits.length?`<div class=\"ks-crits\">${crits.map(c=>{\n      const cb=c.score==null?'':band(c.score).k;\n      return `<div class=\"ks-crit\">\n        <span class=\"cscore ${cb?'bg-'+cb:''}\">${c.score==null?'—':c.score}<\u002Fspan>\n        <span class=\"ctxt\"><b>${esc(c.t)}<\u002Fb><span class=\"cans\">${esc(c.optText)}<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>`;}).join('')}<\u002Fdiv>`:''}\n  <\u002Fdiv>`;\n}\nfunction ksColHTML(cls,items){\n  const title = cls==='keep' ? 'שימור' : 'שיפור';\n  const rule  = cls==='keep' ? `ציון ${KS_THRESHOLD} ומעלה` : `ציון נמוך מ-${KS_THRESHOLD}`;\n  const ic    = cls==='keep' ? '<path d=\"M20 6L9 17l-5-5\"/>' : '<path d=\"M12 20V10M6 20V4M18 20v-7\"/>';\n  return `<div class=\"ks-col ${cls}\">\n    <h4>${svg(ic)}${title}<span class=\"cnt\">${items.length}<\u002Fspan><\u002Fh4>\n    ${items.length ? items.map(ksEntryHTML).join('')\n                   : `<p class=\"ks-empty\">אין נושאים ב${rule}.<\u002Fp>`}\n  <\u002Fdiv>`;\n}\n/* הבלוק המלא — משמש גם במחולל הדוחות וגם בדו\"ח המופק */\nfunction ksReportHTML(){\n  const bk=ksBuckets();\n  if(!bk.improve.length && !bk.keep.length)\n    return '<p class=\"ks-empty\">טרם נבחרו אפשרויות — ריכוז השיפור/שימור ייבנה אוטומטית עם בחירת האפשרויות.<\u002Fp>';\n  return `<div class=\"ks-report\">${ksColHTML('improve',bk.improve)}${ksColHTML('keep',bk.keep)}<\u002Fdiv>`;\n}\nfunction scanKSByCategory(){\n  const out=[];\n  // רמת החטיבה נחשבת קטגוריה אחת\n  const gAvg=dimTopicAvg('gph','gph',gphCell);\n  if(gAvg!=null) out.push({area:'רמת החטיבה (גפ\"ה)',dimLabel:'גפ\"ה',avg:gAvg,cls:ksAuto(gAvg)});\n  S.frameworks.forEach(f=>{\n    FW_DIMS.forEach(dim=>{\n      const avg=dimTopicAvg(f.id,dim,(a,b)=>fwCell(f.id,dim,a,b));\n      if(avg==null)return;\n      out.push({area:(f.label||'מסגרת'),dimLabel:DIM_META[dim].label,avg,cls:ksAuto(avg)});\n    });\n  });\n  return out;\n}\n\n/* הנחיות לטיפול מיידי — מתוך הממצאים החלשים, מתועדפות */\nfunction genDirectives(){\n  const items=scanFindings().filter(x=>x.score!=null&&x.score<=69);\n  items.sort((a,b)=>a.score-b.score);\n  return items.map(x=>{\n    const kb=kbOf(x.dim,x.name);\n    const tag=x.score<60?'טיפול מיידי':'לטיפול';\n    const fnd=x.find?` נמצא: ${x.find}.`:'';\n    const ref=kb.ref?` (נוהל ${kb.ref})`:'';\n    return `[${tag}] ${x.name} — ${x.scope} (ציון ${Math.round(x.score)}):${fnd} נדרש ${kb.fix}${ref}.`;\n  });\n}\n\n/* סקירת מגמות — שימור / שיפור / המלצות, מתוך המאפיינים החוזרים */\nfunction genTrends(){\n  const p=detectPatterns();\n  const keep=p.keep.length\n    ? p.keep.map(x=>`• ${x.name} — נשמר ברמה גבוהה (ממוצע ${x.avg}) ב-${x.fw} מסגרות.`).join('\\n') : '';\n  const improve=p.improve.length\n    ? p.improve.map(x=>`• ${x.name} — חוזר כפער ב-${x.fw} מסגרות (ממוצע ${x.avg}).`).join('\\n') : '';\n  const recs=p.improve.map(x=>{\n    const parts=x.name.split(' · '); const name=parts[0]; const dim=SHORT2DIM[parts[1]]||'prog';\n    const kb=kbOf(dim,name);\n    return `• ${name}: ${kb.fix}${kb.ref?` (נוהל ${kb.ref})`:''}.`;\n  }).join('\\n');\n  return {keep,improve,recs};\n}\n\n/* הערכה מסכמת — תמונת המצב הכוללת לפי הציונים והממדים */\nfunction genSummary(){\n  const ov=overallScore(); if(ov==null) return '';\n  const ob=band(ov), gs=gphScore(), nf=S.frameworks.length;\n  const ds=FW_DIMS.map(d=>({d,s:dimAvgAcrossFw(d),label:DIM_META[d].label})).filter(x=>x.s!=null);\n  ds.sort((a,b)=>b.s-a.s);\n  const fwWord=nf===1?'מסגרת אחת שנבדקה':nf+' מסגרות שנבדקו';\n  let t=`ביקורת ההדרכה${S.meta.unit?' ביחידת '+S.meta.unit:''} העלתה ציון מסכם משוקלל של ${Math.round(ov)}/100 (${ob.t}), על בסיס ${fwWord}`;\n  if(gs!=null) t+=` ורמת חטיבה (גפ\"ה) שעמדה על ${Math.round(gs)}`;\n  t+='. ';\n  if(ds.length>=2){\n    const best=ds[0], worst=ds[ds.length-1];\n    if(Math.round(best.s)!==Math.round(worst.s))\n      t+=`הממד החזק ביותר הוא ${best.label} (${Math.round(best.s)}), ואילו ${worst.label} (${Math.round(worst.s)}) מציב את האתגר המרכזי הדורש חיזוק. `;\n  }\n  t+=({\n    good:'תמונת המצב הכוללת טובה ומשקפת עמידה רחבה בנהלי תקן \"יסודות מנצחים\"; הדגש הוא על שימור ההישגים והשלמת פערים נקודתיים.',\n    mid:'תמונת המצב הכוללת סבירה ומשקפת עמידה חלקית בתקן; נדרש מאמץ ממוקד לסגירת הפערים שזוהו ולהעלאת האחידות בין המסגרות.',\n    low:'תמונת המצב מצביעה על פערים מהותיים מול נהלי התקן, הדורשים תכנית התערבות מסודרת בליווי הדרג הממונה.'\n  }[ob.k]||'');\n  return t;\n}\n\n/* התייחסות כללית — מבט רוחבי: שונות בין מסגרות, סביבה וניהול ידע */\nfunction genCrossCut(){\n  const ov=overallScore(); if(ov==null) return '';\n  let t='';\n  const fs=S.frameworks.map(f=>fwScore(f.id)).filter(v=>v!=null);\n  if(fs.length>=2){\n    const spread=Math.round(Math.max.apply(null,fs)-Math.min.apply(null,fs));\n    t += spread>=15\n      ? `ניכרת שונות בין המסגרות (פער של כ-${spread} נק' בין הגבוהה לנמוכה), המעידה על יישום לא-אחיד של נהלי התקן ועל הזדמנות להאחדה ולהפצת שיטות עבודה טובות בין המסגרות. `\n      : `רמת היישום בין המסגרות אחידה יחסית, המעידה על שגרת עבודה הדרכתית מבוססת ומשותפת. `;\n  }\n  t+='מומלץ לעגן את ממצאי הביקורת בתכנית עבודה מתעדכנת — עם אחראים ולוחות זמנים — ולשוב ולבחון את סגירת הפערים בבקרה הפנימית הבאה.';\n  return t;\n}\n\n/* ----- חיווט לממשק ----- */\nfunction confirmRepl(cur,msg){ return !(cur&&cur.trim())||confirm(msg||'קיים תוכן בשדה. להחליפו בטיוטה המחוללת?'); }\nfunction genOne(which){\n  if(which==='summary'){ const v=genSummary(); if(!v){toast('יש לבחור אפשרויות במסגרות לפני הניסוח');return;} if(!confirmRepl(S.report.summary))return; S.report.summary=v; }\n  else if(which==='crossCut'){ const v=genCrossCut(); if(!v){toast('יש להזין ציונים במסגרות לפני הניסוח');return;} if(!confirmRepl(S.report.crossCut))return; S.report.crossCut=v; }\n  else if(which==='directives'){ const lines=genDirectives(); if(!lines.length){toast('לא זוהו נושאים בציון נמוך הדורשים טיפול');return;}\n    if(S.report.directives.some(d=>d.trim())&&!confirm('קיימות הנחיות שהוזנו. להחליפן בטיוטה המחוללת?'))return; S.report.directives=lines; }\n  else if(which==='trends'){ const tr=genTrends(); if(!tr.keep&&!tr.improve){toast('טרם זוהו מגמות חוזרות (נדרשות שתי מסגרות ומעלה)');return;}\n    if((S.report.trendsKeep+S.report.trendsImprove+S.report.recommendations).trim()&&!confirm('קיים תוכן בסקירת המגמות. להחליפו בטיוטה המחוללת?'))return;\n    S.report.trendsKeep=tr.keep; S.report.trendsImprove=tr.improve; S.report.recommendations=tr.recs; }\n  save(); render(); toast('נוסחה טיוטה — ניתנת לעריכה חופשית');\n}\nfunction genAll(){\n  if(overallScore()==null){ toast('יש להזין ציונים במסגרות לפני הניסוח'); return; }\n  const has=(S.report.summary+S.report.crossCut+S.report.trendsKeep+S.report.trendsImprove+S.report.recommendations).trim()||S.report.directives.some(d=>d.trim());\n  if(has&&!confirm('לחולל טיוטות חדשות לכל הסעיפים? תוכן קיים בסעיפים אלו יוחלף.'))return;\n  S.report.summary=genSummary();\n  const dl=genDirectives(); if(dl.length) S.report.directives=dl;\n  const tr=genTrends(); S.report.trendsKeep=tr.keep; S.report.trendsImprove=tr.improve; S.report.recommendations=tr.recs;\n  save(); render(); toast('נוסחו טיוטות לכל הסעיפים — ניתנות לעריכה');\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
